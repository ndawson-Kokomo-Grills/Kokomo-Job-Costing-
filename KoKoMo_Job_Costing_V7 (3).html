function rPL(){
  var el=document.getElementById('pl');
  var delivered=fgiList.filter(function(f){return f.status==='delivered'&&!f.estimated;});
  var regular=delivered.filter(function(f){return!f.soldFromFloor;});
  var fromFloor=delivered.filter(function(f){return f.soldFromFloor;});
  var tCOGS=r2(delivered.reduce(function(s,f){return s+f.totalCost;},0));
  var tMat=r2(delivered.reduce(function(s,f){return s+(f.matTotal||0);},0));
  var tLab=r2(delivered.reduce(function(s,f){return s+f.labTotal;},0));
  var tMOH=r2(delivered.reduce(function(s,f){return s+f.mohTotal;},0));
  var tSid=r2(delivered.reduce(function(s,f){return s+(f.sidingTotal||0);},0));

  // ── Monthly WIP cost input report ──
  // Group weeklyData by month, prorating each week across months by WORKDAYS (Mon-Fri)
  var monthlyWIP={};
  function ensureMoPL(mo){
    if(!monthlyWIP[mo]){
      var dt=new Date(mo+'-01T00:00:00');
      monthlyWIP[mo]={mat:0,bur:0,moh:0,moLabel:dt.toLocaleDateString('en-US',{month:'short',year:'numeric'})};
    }
    return monthlyWIP[mo];
  }
  Object.keys(weeklyData).sort().forEach(function(sun){
    var wd=weeklyData[sun];
    var split=weekMonthSplit(sun);
    var wMat=0,wBur=0,wMoh=0;
    ['Framing','Tile','PSU'].forEach(function(dept){
      if(wd&&wd[dept]){
        wMat+=wd[dept].mat||0;
        wBur+=wd[dept].burden||0;
        wMoh+=(wd[dept].hrs||0)*mohRateFor(sun);
      }
    });
    Object.keys(split).forEach(function(mo){
      var d=ensureMoPL(mo),fr=split[mo];
      d.mat+=wMat*fr;d.bur+=wBur*fr;d.moh+=wMoh*fr;
    });
  });
  // Siding costs flow into Materials too — count them as entered in the month they were added
  // (siding is folded into matTotal everywhere downstream, so it must also flow in here
  // or the cumulative WIP materials balance drains negative as islands get delivered)
  sidingEntries.forEach(function(e){
    if(!e.date)return;
    var mo=e.date.slice(0,7);
    if(!monthlyWIP[mo]){
      var dt=new Date(e.date+'T00:00:00');
      monthlyWIP[mo]={mat:0,bur:0,moh:0,moLabel:dt.toLocaleDateString('en-US',{month:'short',year:'numeric'})};
    }
    monthlyWIP[mo].mat+=e.cost;
  });

  // Group deliveries by month (ship date)
  // monthlyPL = all COGS (for the COGS columns). monthlyFGICogs = only deliveries
  // that came THROUGH regular FGI (excludes floor-model sales), used for the FGI
  // balance roll-forward so it reconciles to the live FGI-only total.
  var monthlyPL={};
  var monthlyFGICogs={};
  delivered.forEach(function(f){
    var mo=(f.deliveredDate||'0000-00').slice(0,7);
    if(!monthlyPL[mo])monthlyPL[mo]={mat:0,lab:0,moh:0,sid:0,total:0,count:0,moLabel:mo==='0000-00'?'No date':''};
    var d=monthlyPL[mo];
    d.mat+=f.matTotal||0;d.lab+=f.labTotal||0;d.moh+=f.mohTotal||0;
    d.sid+=f.sidingTotal||0;d.total+=f.totalCost;d.count++;
    if(!d.moLabel&&f.deliveredDate){
      var dt=new Date(f.deliveredDate+'T00:00:00');
      d.moLabel=dt.toLocaleDateString('en-US',{month:'short',year:'numeric'});
    }
    // FGI-sourced COGS only (exclude floor-model sales, which never sat in FGI)
    if(!f.soldFromFloor){
      monthlyFGICogs[mo]=r2((monthlyFGICogs[mo]||0)+f.totalCost);
    }
  });

  // WIP → FGI transfers per month with mat/lab/moh breakdown
  // Every island that reached FGI flows IN during its completion month.
  // Delivered islands flow OUT (as COGS) during their delivery month.
  // Using each island's own totalCost on both sides guarantees the roll-forward
  // reconciles exactly to the live FGI balance.
  var monthlyFGIOut={};   // entered FGI (excludes floor models) — for FGI balance
  var monthlyWIPOut={};    // left WIP (includes floor models) — for WIP balance
  function fgiCompMonth(f){
    var psuJ=jobs.find(function(j){return j.so===f.so&&j.dept==='PSU';});
    var tileJ=jobs.find(function(j){return j.so===f.so&&j.dept==='Tile';});
    var compJ=psuJ||tileJ;
    var compMo=null;
    if(compJ){
      var compH=compJ.history.filter(function(h){return h.pctA>=1;}).sort(function(a,b){return a.sun.localeCompare(b.sun);});
      if(compH.length)compMo=compH[0].sun.slice(0,7);
    }
    if(!compMo&&f.deliveredDate)compMo=f.deliveredDate.slice(0,7);
    if(!compMo)compMo=f.sun?f.sun.slice(0,7):null;
    return compMo;
  }
  fgiList.forEach(function(f){
    // Outflow is based on the island's ACTUAL in-system WIP costs. Imported/historical
    // islands (no weekly-entry jobs) never passed through WIP here, so they contribute
    // nothing to WIP outflow — subtracting their imported cost is what previously drove
    // the WIP balance negative.
    var allJ=jobs.filter(function(j){return j.so===f.so;});
    var oMat=0,oLab=0,oMoh=0;
    allJ.forEach(function(j){j.wipCosts.forEach(function(c){oMat+=c.mat;oLab+=c.lab;oMoh+=c.moh;});});
    // Ready-to-ship completed islands now STAY in WIP until delivered; only floor models
    // and delivered islands actually leave WIP.
    if(allJ.length&&(f.status==='floormodel'||f.status==='delivered')){
      var leaveMo=(f.status==='delivered'&&f.deliveredDate)?f.deliveredDate.slice(0,7):fgiCompMonth(f);
      if(leaveMo){
        if(!monthlyWIPOut[leaveMo])monthlyWIPOut[leaveMo]={total:0,mat:0,lab:0,moh:0};
        monthlyWIPOut[leaveMo].total+=r2(oMat+oLab+oMoh);
        monthlyWIPOut[leaveMo].mat+=oMat;
        monthlyWIPOut[leaveMo].lab+=oLab;
        monthlyWIPOut[leaveMo].moh+=oMoh;
      }
    }
    // FGI bucket (see caveat — anchored to the live floor-model total at the endpoint)
    var compMo=fgiCompMonth(f);
    if(!compMo)return;
    if(f.status==='floormodel'||f.soldFromFloor)return;
    if(!monthlyFGIOut[compMo])monthlyFGIOut[compMo]={total:0,mat:0,lab:0,moh:0,count:0};
    monthlyFGIOut[compMo].total+=f.totalCost;
    monthlyFGIOut[compMo].mat+=f.matTotal||0;
    monthlyFGIOut[compMo].lab+=f.labTotal||0;
    monthlyFGIOut[compMo].moh+=f.mohTotal||0;
    monthlyFGIOut[compMo].count++;
  });

  var currentWIPTotal=r2(totalWIPVal());
  var allMonths=Array.from(new Set(
    Object.keys(monthlyWIP).concat(Object.keys(monthlyPL)).concat(Object.keys(monthlyFGIOut)).concat(Object.keys(monthlyWIPOut))
  )).sort();
  var cumWIP=0,cumFGI=0,cumWipMat=0,cumWipLab=0,cumWipMoh=0;
  var monthEndWIP={},monthEndFGI={},monthEndWipMat={},monthEndWipLab={},monthEndWipMoh={};
  allMonths.forEach(function(mo){
    var w=monthlyWIP[mo]||{mat:0,bur:0,moh:0};
    var wipOut=monthlyWIPOut[mo]||{total:0,mat:0,lab:0,moh:0};
    var fgiIn=monthlyFGIOut[mo]||{total:0,mat:0,lab:0,moh:0};
    cumWIP=r2(cumWIP+w.mat+w.bur+w.moh-wipOut.total);
    cumFGI=r2(cumFGI+fgiIn.total-(monthlyFGICogs[mo]||0));
    cumWipMat=r2(cumWipMat+w.mat-wipOut.mat);
    cumWipLab=r2(cumWipLab+w.bur-wipOut.lab);
    cumWipMoh=r2(cumWipMoh+w.moh-wipOut.moh);
    monthEndWIP[mo]=cumWIP;monthEndFGI[mo]=cumFGI;
    monthEndWipMat[mo]=cumWipMat;monthEndWipLab[mo]=cumWipLab;monthEndWipMoh[mo]=cumWipMoh;
  });
  if(allMonths.length){
    monthEndWIP[allMonths[allMonths.length-1]]=currentWIPTotal;
    // FGI now = floor models (ready-to-ship completed islands are counted in WIP).
    // Anchor the final month's FGI balance to the live floor-model total.
    monthEndFGI[allMonths[allMonths.length-1]]=r2(totalFloorVal());
    // Also anchor the Mat/Lab/MOH sub-breakdown to the actual WIP report totals
    var wipSummary=getWIPSummary();
    var realWipMat=r2(wipSummary.reduce(function(s,r){return s+r.mat;},0));
    var realWipLab=r2(wipSummary.reduce(function(s,r){return s+r.lab;},0));
    var realWipMoh=r2(wipSummary.reduce(function(s,r){return s+r.moh;},0));
    monthEndWipMat[allMonths[allMonths.length-1]]=realWipMat;
    monthEndWipLab[allMonths[allMonths.length-1]]=realWipLab;
    monthEndWipMoh[allMonths[allMonths.length-1]]=realWipMoh;
  }

  var monthlyHtml=allMonths.length===0?'<p style="font-size:12px;color:#555;padding:1rem;">No monthly data yet.</p>'
    :'<table><thead><tr>'
    +'<th style="width:75px;">Month</th>'
    +'<th style="width:85px;text-align:right;color:#4a9eff;">Mat entered</th>'
    +'<th style="width:85px;text-align:right;color:#4a9eff;">Labor entered</th>'
    +'<th style="width:85px;text-align:right;color:#4a9eff;">MOH applied</th>'
    +'<th style="width:85px;text-align:right;color:#4a9eff;">Total entered</th>'
    +'<th style="width:14px;"></th>'
    +'<th style="width:82px;text-align:right;color:#f0a030;">FGI flow</th>'

    +(plCogsExp
      ?'<th colspan="4" style="text-align:center;cursor:pointer;color:#e24b4a;background:#1a0505;padding:5px 8px;" onclick="togglePLCogs()">&#9660; COGS <span style="font-size:9px;opacity:.7;">(Mat / Labor / MOH / Siding)</span></th>'
      :'<th style="width:82px;text-align:right;cursor:pointer;color:#e24b4a;" onclick="togglePLCogs()" title="Click to expand COGS breakdown">&#9654; Total COGS</th>'
    )
    +'<th style="width:14px;"></th>'
    +(plWipExp
      ?'<th colspan="3" style="text-align:center;cursor:pointer;color:#4a9eff;background:#0d1e38;padding:5px 8px;" onclick="togglePLWip()">&#9660; WIP Balance <span style="font-size:9px;opacity:.7;">(Mat / Labor / MOH)</span></th>'
      :'<th style="width:88px;text-align:right;cursor:pointer;color:#4a9eff;" onclick="togglePLWip()" title="Click to expand WIP breakdown">&#9654; WIP balance</th>'
    )
    +'<th style="width:72px;text-align:right;color:#555;">Change</th>'
    +'</tr></thead><tbody>'
    +allMonths.map(function(mo,i){
      var w=monthlyWIP[mo]||{mat:0,bur:0,moh:0,moLabel:''};
      var p=monthlyPL[mo]||{mat:0,lab:0,moh:0,sid:0,total:0,count:0,moLabel:''};
      var fgiOut=monthlyFGIOut[mo]||{total:0,count:0};
      var wTotal=r2(w.mat+w.bur+w.moh);

      var cogsCells=plCogsExp

      function wipBalCell(v){var n=r2(v);if(n===0)return'<td style="text-align:right;color:#555;">&mdash;</td>';return'<td style="text-align:right;color:'+(n<0?'#e24b4a':'#4a9eff')+';">'+fmt(n)+'</td>';}
      var wipCells=plWipExp

    }).join('')
    +(function(){

      var tWmat=r2(Object.values(monthlyWIP).reduce(function(s,m){return s+m.mat;},0));
      var tWbur=r2(Object.values(monthlyWIP).reduce(function(s,m){return s+m.bur;},0));
      var tWmoh=r2(Object.values(monthlyWIP).reduce(function(s,m){return s+m.moh;},0));
      var tFgiOut=r2(Object.values(monthlyFGIOut).reduce(function(s,m){return s+m.total;},0));
      var cogsTotals=plCogsExp
        ?'<td style="text-align:right;color:#e24b4a;">'+fmt(tMat)+'</td>'
         +'<td style="text-align:right;color:#e24b4a;">'+fmt(tLab)+'</td>'

         +'<td style="text-align:right;color:#a090d0;">'+fmt(tSid)+'</td>'
        :'<td style="text-align:right;color:#e24b4a;">'+fmt(tCOGS)+'</td>';
      var wipTotals=plWipExp
        ?'<td style="text-align:right;color:#4a9eff;" title="Matches WIP report">'+fmt(monthEndWipMat[allMonths[allMonths.length-1]])+'</td>'
         +'<td style="text-align:right;color:#4a9eff;" title="Matches WIP report">'+fmt(monthEndWipLab[allMonths[allMonths.length-1]])+'</td>'
         +'<td style="text-align:right;color:#4a9eff;" title="Matches WIP report">'+fmt(monthEndWipMoh[allMonths[allMonths.length-1]])+'</td>'

      return'<tr style="border-top:2px solid #333;font-weight:600;background:#111;">'

function rDash(){
  var el=document.getElementById('dash');
  var tWIP=r2(totalWIPVal()),tFGI=r2(totalFGIVal()),tFloor=r2(totalFloorVal());
  var tDel=r2(fgiList.filter(function(f){return f.status==='delivered';}).reduce(function(s,f){return s+f.totalCost;},0));
  var stats=DEPTS.map(function(dept){var all=byDept(dept),act=activeJ(dept),fin=doneJ(dept);return{dept:dept,active:act.length,done:fin.length,wFt:r2(all.reduce(function(s,j){return s+j.wFt;},0)),pct:all.length?Math.round(fin.length/all.length*100):0};});

  // Weekly footage KPIs per dept
  // Sum all h.ft (or inferred) per dept per week from job history
  var depts=['Framing','Tile','PSU'];
  var weekFt={Framing:{},Tile:{},PSU:{}};
  jobs.forEach(function(j){
    if(!weekFt[j.dept])return;
    j.history.forEach(function(h){
      var ft=h.ft>0&&h.ft<=j.wFt?h.ft:r2(j.wFt*Math.max(0,(h.pctA||0)-(h.pctB||0)));
      if(ft>0)weekFt[j.dept][h.sun]=(weekFt[j.dept][h.sun]||0)+ft;
    });
  });

  // Build combined line chart — all weeks with data across all depts
  var allWks=Array.from(new Set(
    Object.keys(weekFt.Framing).concat(Object.keys(weekFt.Tile)).concat(Object.keys(weekFt.PSU))
  )).sort();

  var ftKpiHtml='';
  if(allWks.length<2){
    ftKpiHtml='<div class="card"><p style="font-size:12px;color:#555;">Not enough weekly data to chart yet.</p></div>';
  } else {
    var W=900,H=220,padL=52,padR=20,padT=16,padB=48;
    var chartW=W-padL-padR, chartH=H-padT-padB;
    var nWks=allWks.length;

    // Max ft across all depts for Y axis
    var allFtVals=[];
    depts.forEach(function(d){Object.values(weekFt[d]).forEach(function(v){allFtVals.push(v);});});
    var maxFt=allFtVals.length?Math.ceil(Math.max.apply(null,allFtVals)/50)*50:100;

    function xPos(i){return padL+r2(i/(nWks-1)*chartW);}
    function yPos(ft){return padT+r2((1-ft/maxFt)*chartH);}

    // Y grid lines
    var yTicks=5;
    var gridLines='';
    for(var yi=0;yi<=yTicks;yi++){
      var yv=Math.round(maxFt*yi/yTicks);
      var yp=yPos(yv);
      gridLines+='<line x1="'+padL+'" y1="'+yp+'" x2="'+(W-padR)+'" y2="'+yp+'" stroke="#1e1e1e" stroke-width="1"/>';
      gridLines+='<text x="'+(padL-6)+'" y="'+(yp+4)+'" text-anchor="end" font-size="10" fill="#555">'+yv+'</text>';
    }

    // X axis labels — show every N weeks to avoid crowding
    var step=Math.max(1,Math.ceil(nWks/12));
    var xLabels='';
    allWks.forEach(function(sun,i){
      if(i%step!==0&&i!==nWks-1)return;
      var xp=xPos(i);
      var dt=new Date(sun+'T00:00:00');
      var lbl=dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      xLabels+='<text x="'+xp+'" y="'+(H-10)+'" text-anchor="middle" font-size="9" fill="#444">'+lbl+'</text>';
    });

    // Build polyline per dept
    var dclrMap={Framing:'#4a9eff',Tile:'#2dbd85',PSU:'#f0a030'};
    var lines='';
    var dots='';
    depts.forEach(function(dept){
      var clr=dclrMap[dept];
      var pts=[];
      allWks.forEach(function(sun,i){
        var ft=weekFt[dept][sun]||0;
        if(ft>0)pts.push({i:i,ft:ft,sun:sun});
      });
      if(pts.length<1)return;
      // Draw line segments connecting only weeks with data
      for(var pi=0;pi<pts.length-1;pi++){
        var a=pts[pi],b=pts[pi+1];
        lines+='<line x1="'+xPos(a.i)+'" y1="'+yPos(a.ft)+'" x2="'+xPos(b.i)+'" y2="'+yPos(b.ft)+'" stroke="'+clr+'" stroke-width="2" opacity=".85"/>';
      }
      pts.forEach(function(p){
        var dt=new Date(p.sun+'T00:00:00');
        var lbl=dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})+': '+p.ft+'ft';
        dots+='<circle cx="'+xPos(p.i)+'" cy="'+yPos(p.ft)+'" r="3.5" fill="'+clr+'" opacity=".9"><title>'+dept+' '+lbl+'</title></circle>';
      });
    });

    // Legend
    var legend=depts.map(function(d,i){
      return'<g transform="translate('+(i*110)+',0)"><rect x="0" y="-5" width="12" height="4" rx="2" fill="'+dclrMap[d]+'"/><text x="16" y="0" font-size="11" fill="#aaa">'+d+'</text></g>';
    }).join('');

    var svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">'
      +'<g transform="translate(0,10)">'+legend+'</g>'
      +gridLines
      +'<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(H-padB)+'" stroke="#2a2a2a" stroke-width="1"/>'
      +'<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="#2a2a2a" stroke-width="1"/>'
      +xLabels
      +lines+dots
      +'</svg>';

    ftKpiHtml='<div class="card" style="padding:.75rem 1rem .5rem;">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;">'
      +'<div style="font-weight:600;color:#e8e8e8;">Weekly footage output — all departments</div>'
      +'<div style="font-size:11px;color:#555;">'+allWks.length+' weeks &middot; hover dots for details</div>'
      +'</div>'
      +svg+'</div>'
      // Pivot table
      +'<div class="card" style="padding:0;overflow-x:auto;margin-top:1rem;">'
      +'<div class="hdr-row"><div style="font-weight:600;color:#e8e8e8;">Weekly footage — pivot table</div>'
      +'<div style="font-size:11px;color:#555;">ft produced per department per week</div></div>'
      +'<table><thead><tr>'
      +'<th style="width:110px;">Week</th>'
      +'<th style="width:80px;text-align:right;color:#4a9eff;">Framing</th>'
      +'<th style="width:80px;text-align:right;color:#2dbd85;">Tile</th>'
      +'<th style="width:80px;text-align:right;color:#f0a030;">PSU</th>'
      +'<th style="width:80px;text-align:right;color:#e8e8e8;">Total</th>'
      +'<th style="width:180px;">Throughput</th>'
      +'</tr></thead><tbody>'
      +allWks.map(function(sun){
        var fFt=r2(weekFt.Framing[sun]||0);
        var tFt=r2(weekFt.Tile[sun]||0);
        var pFt=r2(weekFt.PSU[sun]||0);
        var tot=r2(fFt+tFt+pFt);
        var maxBar=Math.max.apply(null,allWks.map(function(w){return r2((weekFt.Framing[w]||0)+(weekFt.Tile[w]||0)+(weekFt.PSU[w]||0));}));
        var fW=maxBar>0?Math.round(fFt/maxBar*160):0;
        var tW=maxBar>0?Math.round(tFt/maxBar*160):0;
        var pW=maxBar>0?Math.round(pFt/maxBar*160):0;
        var dt=new Date(sun+'T00:00:00');
        var lbl=dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
        return'<tr>'
          +'<td style="font-size:11px;color:#888;white-space:nowrap;">'+lbl+'</td>'
          +'<td style="text-align:right;color:'+(fFt>0?'#4a9eff':'#333')+';">'+(fFt>0?fFt:'—')+'</td>'
          +'<td style="text-align:right;color:'+(tFt>0?'#2dbd85':'#333')+';">'+(tFt>0?tFt:'—')+'</td>'
          +'<td style="text-align:right;color:'+(pFt>0?'#f0a030':'#333')+';">'+(pFt>0?pFt:'—')+'</td>'
          +'<td style="text-align:right;font-weight:600;color:#e8e8e8;">'+tot+'</td>'
          +'<td><div style="display:flex;gap:1px;align-items:center;">'
          +(fW>0?'<div style="height:8px;width:'+fW+'px;background:#4a9eff;border-radius:1px;opacity:.8;"></div>':'')
          +(tW>0?'<div style="height:8px;width:'+tW+'px;background:#2dbd85;border-radius:1px;opacity:.8;"></div>':'')
          +(pW>0?'<div style="height:8px;width:'+pW+'px;background:#f0a030;border-radius:1px;opacity:.8;"></div>':'')
          +'</div></td>'
          +'</tr>';
      }).join('')
      +(function(){
        var tF=r2(Object.values(weekFt.Framing).reduce(function(s,v){return s+v;},0));
        var tT=r2(Object.values(weekFt.Tile).reduce(function(s,v){return s+v;},0));
        var tP=r2(Object.values(weekFt.PSU).reduce(function(s,v){return s+v;},0));
        var avgF=allWks.length?r2(tF/allWks.length):0;
        var avgT=allWks.length?r2(tT/allWks.length):0;
        var avgP=allWks.length?r2(tP/allWks.length):0;
        return'<tr style="border-top:1px solid #222;background:#111;font-size:11px;color:#555;">'
          +'<td>Avg/wk</td>'
          +'<td style="text-align:right;color:#4a9eff;">'+avgF+'</td>'
          +'<td style="text-align:right;color:#2dbd85;">'+avgT+'</td>'
          +'<td style="text-align:right;color:#f0a030;">'+avgP+'</td>'
          +'<td style="text-align:right;color:#e8e8e8;">'+r2(avgF+avgT+avgP)+'</td>'
          +'<td></td></tr>'
          +'<tr style="border-top:2px solid #333;background:#111;font-weight:600;">'
          +'<td style="color:#e8e8e8;">Total</td>'
          +'<td style="text-align:right;color:#4a9eff;">'+tF+'</td>'
          +'<td style="text-align:right;color:#2dbd85;">'+tT+'</td>'
          +'<td style="text-align:right;color:#f0a030;">'+tP+'</td>'
          +'<td style="text-align:right;color:#e8e8e8;">'+r2(tF+tT+tP)+'</td>'
          +'<td></td></tr>';
      })()
      +'</tbody></table></div>';
  }

  el.innerHTML=
    '<div class="grid"><div class="metric"><div class="mlabel">WIP</div><div class="mval" style="color:#4a9eff;">'+fmt(tWIP)+'</div></div><div class="metric"><div class="mlabel">FGI (floor models)</div><div class="mval" style="color:#f0a030;">'+fmt(tFloor)+'</div></div><div class="metric"><div class="mlabel">COGS</div><div class="mval" style="color:#e24b4a;">'+fmt(tDel)+'</div></div><div class="metric"><div class="mlabel">Total inventory</div><div class="mval">'+fmt(r2(tWIP+tFloor))+'</div></div><div class="metric"><div class="mlabel">MOH rate</div><div class="mval" style="font-size:14px;">'+fmt(mohRate)+'/hr</div></div></div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1rem;">'+stats.map(function(s){return'<div class="card" style="margin:0;"><div style="display:flex;justify-content:space-between;margin-bottom:.4rem;"><span style="font-weight:600;color:#e8e8e8;">'+s.dept+'</span><span style="font-weight:600;color:'+DCLR[s.dept]+';">'+s.pct+'%</span></div><div class="prog" style="height:5px;margin-bottom:.75rem;"><div class="prog-fill" style="width:'+s.pct+'%;background:'+DCLR[s.dept]+';"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;font-size:11px;"><div><div style="color:#555;">Active</div><div style="font-weight:600;color:#ccc;">'+s.active+'</div></div><div><div style="color:#555;">Done</div><div style="font-weight:600;color:#2dbd85;">'+s.done+'</div></div><div><div style="color:#555;">Total wt ft</div><div style="font-weight:600;color:#ccc;">'+s.wFt+'</div></div></div></div>';}).join('')+'</div>'
    +'<div class="card-title" style="margin-bottom:.5rem;">Weekly footage output</div>'
    +ftKpiHtml
    +'<div class="card"><div class="card-title">Balance sheet flow</div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;">'
    +'<div style="background:#0d1e38;border:1px solid #1a3060;border-radius:8px;padding:12px 18px;text-align:center;min-width:95px;"><div style="font-size:10px;color:#4a9eff;text-transform:uppercase;margin-bottom:3px;">WIP</div><div style="font-weight:600;color:#4a9eff;">'+fmt(tWIP)+'</div></div>'
    +'<span style="color:#333;font-size:18px;">&rarr;</span>'
    +'<div style="background:#0a2a1a;border:1px solid #0f4028;border-radius:8px;padding:12px 18px;text-align:center;min-width:95px;"><div style="font-size:10px;color:#2dbd85;text-transform:uppercase;margin-bottom:3px;">FGI</div><div style="font-weight:600;color:#2dbd85;">'+fmt(tFGI)+'</div></div>'
    +'<span style="color:#333;font-size:18px;">&rarr;</span>'
    +'<div style="background:#1a0d00;border:1px solid #2a1800;border-radius:8px;padding:12px 18px;text-align:center;min-width:95px;"><div style="font-size:10px;color:#f0a030;text-transform:uppercase;margin-bottom:3px;">Floor model</div><div style="font-weight:600;color:#f0a030;">'+fmt(tFloor)+'</div></div>'
    +'<span style="color:#333;font-size:18px;">&rarr;</span>'
    +'<div style="background:#2a0d0d;border:1px solid #3a1212;border-radius:8px;padding:12px 18px;text-align:center;min-width:95px;"><div style="font-size:10px;color:#e24b4a;text-transform:uppercase;margin-bottom:3px;">COGS (P&amp;L)</div><div style="font-weight:600;color:#e24b4a;">'+fmt(tDel)+'</div></div>'
    +'</div></div>'

    // ── Floor models — inventory + pipeline, by model (expandable) ──
    +(function(){
      function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
      var order={Framing:0,Tile:1,PSU:2};

      // Units currently in floor-model inventory (each entry = 1 physical island)
      var invUnits=fgiList.filter(function(f){return f.status==='floormodel';}).map(function(f){
        return{so:f.so,name:(getSOName(f.so)||f.name||'').trim()||'(Unnamed)',location:(f.location||'').trim(),est:!!f.estimated,cost:f.totalCost||0};
      });

      // Floor-model SOs (4-digit) still being built — not yet in FGI/inventory/delivered
      var fgiSOset={};fgiList.forEach(function(f){fgiSOset[String(f.so).trim()]=true;});
      var wipMap={};
      jobs.forEach(function(j){
        var so=String(j.so).trim();
        if(!isFloorModelSO(so)||fgiSOset[so])return;
        if(!wipMap[so])wipMap[so]=[];
        wipMap[so].push(j);
      });
      var wipUnits=Object.keys(wipMap).map(function(so){
        var js=wipMap[so];
        var active=js.filter(function(x){return x.pct<1;}).sort(function(a,b){return order[b.dept]-order[a.dept];});
        var sj=active[0]||js.slice().sort(function(a,b){return order[b.dept]-order[a.dept];})[0];
        return{so:so,name:(getSOName(so)||'').trim()||'(Unnamed)',dept:sj.dept,pct:sj.pct};
      });

      if(!invUnits.length&&!wipUnits.length)
        return'<div class="card"><div class="card-title">Floor models — inventory &amp; pipeline</div><p style="font-size:12px;color:#555;">No floor models in inventory or in progress. Name a 4-digit SO on a department tab to start tracking one.</p></div>';

      // Group by model name (case-insensitive)
      var groups={};
      function grp(name){var k=name.toLowerCase();if(!groups[k])groups[k]={name:name,inv:0,wip:0,val:0,est:0,invUnits:[],wipUnits:[]};return groups[k];}
      invUnits.forEach(function(u){var g=grp(u.name);g.inv++;g.val=r2(g.val+u.cost);if(u.est)g.est++;g.invUnits.push(u);});
      wipUnits.forEach(function(u){var g=grp(u.name);g.wip++;g.wipUnits.push(u);});

      var rows=Object.keys(groups).map(function(k){return groups[k];})
        .sort(function(a,b){return(b.inv+b.wip)-(a.inv+a.wip)||a.name.localeCompare(b.name);});

      var totInv=invUnits.length,totWip=wipUnits.length,totVal=r2(invUnits.reduce(function(s,u){return s+u.cost;},0)),distinct=rows.length;

      var body=rows.map(function(g){
        var detail='';
        if(g.invUnits.length){
          detail+='<div style="margin-top:6px;"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#f0a030;margin-bottom:4px;">In inventory &mdash; location</div>'
            +g.invUnits.slice().sort(function(a,b){return(a.location||'~').localeCompare(b.location||'~');}).map(function(u){
              return'<div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0;border-bottom:1px solid #141414;">'
                +'<span class="mono" style="color:#ccc;min-width:64px;">'+esc(u.so)+(u.est?' <span class="tag-fm">est</span>':'')+'</span>'
                +'<span style="color:#aaa;flex:1;">'+(u.location?esc(u.location):'<span style="color:#555;">no location set</span>')+'</span>'
                +'<span style="color:#ccc;min-width:90px;text-align:right;">'+fmt(u.cost)+'</span>'
                +'</div>';
            }).join('')+'</div>';
        }
        if(g.wipUnits.length){
          detail+='<div style="margin-top:10px;"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#4a9eff;margin-bottom:4px;">In progress &mdash; stage of production</div>'
            +g.wipUnits.slice().sort(function(a,b){return order[b.dept]-order[a.dept]||b.pct-a.pct;}).map(function(u){
              var clr=DCLR[u.dept]||'#888';
              return'<div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0;border-bottom:1px solid #141414;">'
                +'<span class="mono" style="color:#ccc;min-width:64px;">'+esc(u.so)+'</span>'
                +'<span style="color:#aaa;flex:1;"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+clr+';margin-right:6px;vertical-align:middle;"></span>'+u.dept+'</span>'
                +'<span style="color:'+clr+';min-width:90px;text-align:right;font-weight:600;">'+Math.round(u.pct*100)+'%</span>'
                +'</div>';
            }).join('')+'</div>';
        }
        return'<details style="border-bottom:1px solid #1a1a1a;">'
          +'<summary style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;cursor:pointer;">'
          +'<span style="color:#e8e8e8;font-weight:600;font-size:13px;">'+esc(g.name)+(g.est>0?' <span class="tag-fm" title="'+g.est+' tracked as estimate — excluded from financials">'+g.est+' est</span>':'')+'</span>'
          +'<span style="display:flex;gap:16px;align-items:center;font-size:12px;white-space:nowrap;">'
          +'<span style="color:#777;">Inventory <b style="color:#f0a030;font-size:14px;">'+g.inv+'</b></span>'
          +'<span style="color:#777;">In progress <b style="color:#4a9eff;font-size:14px;">'+g.wip+'</b></span>'
          +'<span style="color:#ccc;min-width:90px;text-align:right;">'+(g.val>0?fmt(g.val):'—')+'</span>'
          +'</span></summary>'
          +'<div style="padding:2px 14px 12px 14px;background:#0d0d0d;">'+detail+'</div>'
          +'</details>';
      }).join('');

      return'<div class="card" style="padding:0;">'
        +'<div class="hdr-row"><div style="font-weight:600;color:#e8e8e8;">Floor models — inventory &amp; pipeline</div>'
        +'<div style="font-size:11px;color:#555;">'+distinct+' distinct model'+(distinct===1?'':'s')+' &middot; click a row to expand</div></div>'
        +'<div class="grid" style="padding:0 14px 6px;margin-bottom:0;">'
        +'<div class="metric"><div class="mlabel">In inventory</div><div class="mval" style="color:#f0a030;">'+totInv+'</div></div>'
        +'<div class="metric"><div class="mlabel">In progress</div><div class="mval" style="color:#4a9eff;">'+totWip+'</div></div>'
        +'<div class="metric"><div class="mlabel">Distinct models</div><div class="mval">'+distinct+'</div></div>'
        +'<div class="metric"><div class="mlabel">Inventory value</div><div class="mval" style="font-size:15px;">'+fmt(totVal)+'</div></div>'
        +'</div>'
        +'<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 14px;border-top:1px solid #1e1e1e;border-bottom:1px solid #1e1e1e;background:#111;">'
        +'<span style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#555;">Model</span>'
        +'<span style="display:flex;gap:16px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#555;"><span>Inventory</span><span>In progress</span><span style="min-width:90px;text-align:right;">Value</span></span>'
        +'</div>'
        +body
        +'</div>';
    })()

    // ── Ops KPIs ──
    +(function(){
      var today=Date.now();

      // ── 1. Active islands by pipeline stage ──
      var soActive={};
      jobs.forEach(function(j){
        if(j.pct>=1)return;
        var fEntry=fgiList.find(function(f){return f.so===j.so;});
        if(fEntry)return; // already in FGI
        if(!soActive[j.so])soActive[j.so]={depts:[]};
        soActive[j.so].depts.push(j.dept);
      });
      var stageCount={'Framing only':0,'Framing+Tile':0,'All three':0,'Tile only':0,'PSU only':0,'Other':0};
      Object.values(soActive).forEach(function(s){
        var d=s.depts;
        var hasF=d.indexOf('Framing')>=0,hasT=d.indexOf('Tile')>=0,hasP=d.indexOf('PSU')>=0;
        if(hasF&&hasT&&hasP)stageCount['All three']++;
        else if(hasF&&hasT)stageCount['Framing+Tile']++;
        else if(hasF)stageCount['Framing only']++;
        else if(hasT)stageCount['Tile only']++;
        else if(hasP)stageCount['PSU only']++;
        else stageCount['Other']++;
      });
      var totalActive=Object.values(stageCount).reduce(function(s,v){return s+v;},0)||1;
      var stageOrder=['Framing only','Framing+Tile','All three','Tile only','PSU only'];
      var stageColors={'Framing only':'#4a9eff','Framing+Tile':'#2a7acc','All three':'#2dbd85','Tile only':'#1a8a5a','PSU only':'#f0a030'};
      var stageHtml='<div class="card-title" style="margin-bottom:.75rem;">Pipeline stage — active islands</div>'
        +'<div style="display:flex;gap:3px;height:28px;border-radius:4px;overflow:hidden;margin-bottom:.75rem;">'
        +stageOrder.filter(function(s){return stageCount[s]>0;}).map(function(s){
          return'<div style="flex:'+(stageCount[s]/totalActive)+';background:'+stageColors[s]+';opacity:.85;" title="'+s+': '+stageCount[s]+'"></div>';
        }).join('')+'</div>'
        +'<div style="display:flex;flex-wrap:wrap;gap:12px;">'
        +stageOrder.map(function(s){
          if(!stageCount[s])return'';
          return'<div style="font-size:12px;"><span style="display:inline-block;width:10px;height:10px;background:'+stageColors[s]+';border-radius:2px;margin-right:5px;"></span>'
            +'<span style="color:#aaa;">'+s+'</span> <strong style="color:#e8e8e8;">'+stageCount[s]+'</strong></div>';
        }).join('')+'</div>';

      // ── 2. Labor hrs per foot by dept ──
      var deptHrs={Framing:0,Tile:0,PSU:0};
      var deptFt={Framing:0,Tile:0,PSU:0};
      Object.keys(weeklyData).forEach(function(sun){
        ['Framing','Tile','PSU'].forEach(function(d){
          if(weeklyData[sun]&&weeklyData[sun][d])deptHrs[d]+=weeklyData[sun][d].hrs||0;
        });
      });
      jobs.forEach(function(j){
        if(!deptFt[j.dept]&&deptFt[j.dept]!==0)return;
        j.history.forEach(function(h){
          var ft=h.ft>0&&h.ft<=j.wFt?h.ft:r2(j.wFt*Math.max(0,(h.pctA||0)-(h.pctB||0)));
          if(ft>0)deptFt[j.dept]=r2((deptFt[j.dept]||0)+ft);
        });
      });
      var labHtml=['Framing','Tile','PSU'].map(function(d){
        var clr=d==='Framing'?'#4a9eff':d==='Tile'?'#2dbd85':'#f0a030';
        var hpf=deptFt[d]>0?r2(deptHrs[d]/deptFt[d]):0;
        return'<div class="metric" style="margin:0;"><div class="mlabel">'+d+' hrs/ft</div>'
          +'<div class="mval" style="color:'+clr+';font-size:18px;">'+hpf+'</div>'
          +'<div style="font-size:10px;color:#555;margin-top:2px;">'+r2(deptHrs[d])+'h total &middot; '+r2(deptFt[d])+'ft</div></div>';
      }).join('');

      // ── 3. 4-week rolling avg vs prior 4 weeks + best/worst ──
      var allWks=Array.from(new Set(
        Object.keys(weekFt.Framing).concat(Object.keys(weekFt.Tile)).concat(Object.keys(weekFt.PSU))
      )).sort();
      var n=allWks.length;
      var rolling4={Framing:[],Tile:[],PSU:[]};
      ['Framing','Tile','PSU'].forEach(function(d){
        allWks.forEach(function(sun,i){
          var slice=allWks.slice(Math.max(0,i-3),i+1);
          var avg=r2(slice.reduce(function(s,w){return s+(weekFt[d][w]||0);},0)/slice.length);
          rolling4[d].push(avg);
        });
      });

      // Best/worst per dept
      var bestWorst=['Framing','Tile','PSU'].map(function(d){
        var clr=d==='Framing'?'#4a9eff':d==='Tile'?'#2dbd85':'#f0a030';
        var wkVals=allWks.map(function(w){return{w:w,ft:weekFt[d][w]||0};}).filter(function(x){return x.ft>0;});
        if(!wkVals.length)return'<div class="metric" style="margin:0;"><div class="mlabel">'+d+'</div><div style="color:#444;font-size:12px;">No data</div></div>';
        var best=wkVals.reduce(function(a,b){return b.ft>a.ft?b:a;});
        var worst=wkVals.reduce(function(a,b){return b.ft<a.ft?b:a;});
        var cur4=allWks.slice(-4),prev4=allWks.slice(-8,-4);
        var cur4avg=cur4.length?r2(cur4.reduce(function(s,w){return s+(weekFt[d][w]||0);},0)/cur4.length):0;
        var prev4avg=prev4.length?r2(prev4.reduce(function(s,w){return s+(weekFt[d][w]||0);},0)/prev4.length):0;
        var delta=r2(cur4avg-prev4avg);
        var deltaStr=(delta>=0?'+':'')+delta+' ft/wk';
        var deltaClr=delta>0?'#2dbd85':delta<0?'#e24b4a':'#555';
        return'<div class="card" style="margin:0;">'
          +'<div style="display:flex;justify-content:space-between;margin-bottom:.5rem;">'
          +'<span style="font-weight:600;color:'+clr+';">'+d+'</span>'
          +'<span style="font-size:11px;color:'+deltaClr+';" title="4-wk avg vs prior 4-wk avg">'+deltaStr+'</span>'
          +'</div>'
          +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:11px;">'
          +'<div><div style="color:#555;margin-bottom:2px;">Last 4-wk avg</div><div style="font-weight:700;color:#e8e8e8;font-size:14px;">'+cur4avg+' ft</div></div>'
          +'<div><div style="color:#555;margin-bottom:2px;">&#127942; Best week</div><div style="font-weight:700;color:'+clr+';font-size:14px;">'+best.ft+' ft</div><div style="color:#444;font-size:9px;">'+wkRange(best.w)+'</div></div>'
          +'<div><div style="color:#555;margin-bottom:2px;">&#128197; Lowest week</div><div style="font-weight:700;color:#555;font-size:14px;">'+worst.ft+' ft</div><div style="color:#444;font-size:9px;">'+wkRange(worst.w)+'</div></div>'
          +'</div></div>';
      }).join('');

      // ── 4. Dept sync — avg lag between stages ──
      var fToT=[],tToP=[];
      fgiList.forEach(function(f){
        var fJ=jobs.find(function(j){return j.so===f.so&&j.dept==='Framing';});
        var tJ=jobs.find(function(j){return j.so===f.so&&j.dept==='Tile';});
        var pJ=jobs.find(function(j){return j.so===f.so&&j.dept==='PSU';});
        function compWeek(j){if(!j)return null;var h=j.history.filter(function(x){return x.pctA>=1;}).sort(function(a,b){return a.sun.localeCompare(b.sun);});return h.length?h[0].sun:null;}
        var fw=compWeek(fJ),tw=compWeek(tJ),pw=compWeek(pJ);
        if(fw&&tw){var d=Math.round((new Date(tw+'T00:00:00')-new Date(fw+'T00:00:00'))/(1000*60*60*24*7));fToT.push(d);}
        if(tw&&pw){var d2=Math.round((new Date(pw+'T00:00:00')-new Date(tw+'T00:00:00'))/(1000*60*60*24*7));tToP.push(d2);}
      });
      var avgFT=fToT.length?r2(fToT.reduce(function(s,v){return s+v;},0)/fToT.length):null;
      var avgTP=tToP.length?r2(tToP.reduce(function(s,v){return s+v;},0)/tToP.length):null;
      var syncHtml='<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">'
        +'<div style="text-align:center;padding:.75rem;background:#0d1e38;border-radius:8px;">'
        +'<div style="font-size:11px;color:#555;margin-bottom:4px;">Framing → Tile lag</div>'
        +'<div style="font-size:22px;font-weight:700;color:#4a9eff;">'+(avgFT!==null?avgFT+' wks':'—')+'</div>'
        +'<div style="font-size:10px;color:#444;">avg across '+fToT.length+' islands</div></div>'
        +'<div style="text-align:center;padding:.75rem;background:#0a2a1a;border-radius:8px;">'
        +'<div style="font-size:11px;color:#555;margin-bottom:4px;">Tile → PSU lag</div>'
        +'<div style="font-size:22px;font-weight:700;color:#2dbd85;">'+(avgTP!==null?avgTP+' wks':'—')+'</div>'
        +'<div style="font-size:10px;color:#444;">avg across '+tToP.length+' islands</div></div>'
        +'</div>';

      // ── 5. Cycle time chart (delivered islands, days first history → ship date) ──
      var cycleTimes=fgiList.filter(function(f){return f.status==='delivered'&&f.deliveredDate;}).map(function(f){
        var allJ2=jobs.filter(function(j){return j.so===f.so;});
        var suns=[];allJ2.forEach(function(j){j.history.forEach(function(h){if(h.sun)suns.push(h.sun);});});
        if(!suns.length)return null;
        var earlyDate=suns.sort()[0];
        var days=Math.floor((new Date(f.deliveredDate+'T00:00:00')-new Date(earlyDate+'T00:00:00'))/(1000*60*60*24));
        return{so:f.so,days:days,cost:f.totalCost};
      }).filter(function(x){return x&&x.days>=0;}).sort(function(a,b){return a.days-b.days;});
      var avgCycle=cycleTimes.length?Math.round(cycleTimes.reduce(function(s,x){return s+x.days;},0)/cycleTimes.length):0;
      var medCycle=cycleTimes.length?cycleTimes[Math.floor(cycleTimes.length/2)].days:0;

      var cycleHtml='';
      if(cycleTimes.length>1){
        var maxDays=Math.max.apply(null,cycleTimes.map(function(x){return x.days;}));
        var W=880,H=160,pL=36,pR=16,pT=16,pB=36;
        var cW=W-pL-pR,cH=H-pT-pB;
        var bars='';
        var step=Math.max(1,Math.floor(cycleTimes.length/40));
        cycleTimes.forEach(function(x,i){
          if(i%step!==0&&i!==cycleTimes.length-1)return;
          var bw=Math.max(2,Math.floor(cW/cycleTimes.length*step)-1);
          var bx=pL+Math.floor(i/cycleTimes.length*cW);
          var bh=maxDays>0?Math.max(2,Math.round(x.days/maxDays*cH)):2;
          var clr=x.days>90?'#e24b4a':x.days>60?'#f0a030':'#4a9eff';
          bars+='<rect x="'+bx+'" y="'+(pT+cH-bh)+'" width="'+bw+'" height="'+bh+'" fill="'+clr+'" opacity=".8" rx="1"><title>SO '+x.so+': '+x.days+' days</title></rect>';
        });
        // avg line
        var avgY=pT+cH-Math.round(avgCycle/maxDays*cH);
        var yTick=Math.ceil(maxDays/4/10)*10;
        var gridL='';
        for(var yi=0;yi<=4;yi++){var yv=yTick*yi;var yp=pT+cH-Math.round(Math.min(yv,maxDays)/maxDays*cH);gridL+='<line x1="'+pL+'" y1="'+yp+'" x2="'+(W-pR)+'" y2="'+yp+'" stroke="#1e1e1e" stroke-width="1"/><text x="'+(pL-4)+'" y="'+(yp+4)+'" text-anchor="end" font-size="9" fill="#444">'+yv+'d</text>';}
        cycleHtml='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">'
          +gridL+bars
          +'<line x1="'+pL+'" y1="'+avgY+'" x2="'+(W-pR)+'" y2="'+avgY+'" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4,3" opacity=".5"/>'
          +'<text x="'+(W-pR-2)+'" y="'+(avgY-3)+'" text-anchor="end" font-size="9" fill="#e8e8e8" opacity=".7">avg '+avgCycle+'d</text>'
          +'<text x="'+pL+'" y="'+(H-4)+'" font-size="9" fill="#444">Delivered islands — sorted by cycle time</text>'
          +'</svg>';
      }

      return'<div class="card-title" style="margin:1rem 0 .5rem;">Operations KPIs</div>'
        // Stage pipeline
        +'<div style="display:grid;grid-template-columns:1fr 2fr;gap:1rem;margin-bottom:1rem;">'
        +'<div class="card" style="margin:0;">'+stageHtml+'</div>'
        // Dept sync
        +'<div class="card" style="margin:0;"><div class="card-title" style="margin-bottom:.75rem;">Department sync — avg weeks between stages</div>'+syncHtml+'</div>'
        +'</div>'
        // Labor hrs/ft
        +'<div class="card" style="margin-bottom:1rem;"><div class="card-title" style="margin-bottom:.75rem;">Labor hours per weighted foot</div>'
        +'<div class="grid">'+labHtml+'</div></div>'
        // 4-wk rolling avg + best/worst
        +(allWks.length>3?'<div class="card" style="margin-bottom:1rem;"><div class="card-title" style="margin-bottom:.75rem;">4-week rolling average vs prior period &amp; capacity range</div>'
        +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;">'+bestWorst+'</div></div>':'')
        // Cycle time
        +(cycleTimes.length>1?'<div class="card" style="padding:.75rem 1rem .5rem;">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;">'
        +'<div style="font-weight:600;color:#e8e8e8;">Cycle time — first production entry to ship date</div>'
        +'<div style="font-size:11px;color:#555;">'+cycleTimes.length+' islands &middot; avg <strong style="color:#4a9eff;">'+avgCycle+'d</strong> &middot; median <strong style="color:#4a9eff;">'+medCycle+'d</strong></div>'
        +'</div>'+cycleHtml+'</div>':'');
    })()

}

}

// ── SAVE STATE — upsert so it works even if row was deleted ──
function saveState(){
  if(window.canEdit===false){setStatus('View-only mode \u2014 changes not saved','#f0a030');return;}
  var state={
    id:1,
    jobs:jobs,
    weekly_data:weeklyData,
    fgi_list:fgiList,
    siding_entries:sidingEntries,
    moh_history:mohHistory,
    moh_rate:mohRate,
    updated_at:new Date().toISOString(),
    updated_by:getUser()
  };
  setStatus('Saving\u2026','#f0a030');
  fetch(SB_URL+'/rest/v1/kokomo_state',{
    method:'POST',
    headers:Object.assign({},sbHeaders(),{
      'Prefer':'resolution=merge-duplicates,return=minimal'
    }),
    body:JSON.stringify(state)
  }).then(function(r){
    if(r.ok||r.status===201||r.status===204){
      setStatus('\u2713 Saved \u2014 '+new Date().toLocaleTimeString(),'#2dbd85');
    } else {
      r.text().then(function(t){
        setStatus('Save error '+r.status+': '+t.slice(0,80),'#e24b4a');
        console.error('Supabase save error:',r.status,t);
      });
    }
  }).catch(function(e){setStatus('Save failed: '+e.message,'#e24b4a');});
}

// ── SAVE ACTIVITY LOG ENTRY — silent fail if table missing ──
function saveLogEntry(entry){
  fetch(SB_URL+'/rest/v1/activity_log',{
    method:'POST',
    headers:Object.assign(sbHeaders(),{'Prefer':'return=minimal'}),
    body:JSON.stringify({ts:entry.ts,username:entry.user,action:entry.action,detail:entry.detail,week:entry.week})
  }).catch(function(){});
}

// ── LOAD STATE FROM SUPABASE ──
function loadState(){
  setStatus('Loading\u2026','#f0a030');
  fetch(SB_URL+'/rest/v1/kokomo_state?id=eq.1&select=*',{headers:sbHeaders()})
  .then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  })
  .then(function(data){
    if(!data||!data.length){
      setStatus('No saved data \u2014 starting fresh','#555');
      // Insert the initial row so upsert works on first save
      fetch(SB_URL+'/rest/v1/kokomo_state',{
        method:'POST',
        headers:Object.assign({},sbHeaders(),{'Prefer':'return=minimal'}),
        body:JSON.stringify({id:1,jobs:[],weekly_data:{},fgi_list:[],siding_entries:[],moh_history:[],moh_rate:25})
      }).catch(function(){});
      initApp();return;
    }
    var s=data[0];
    if(s.jobs&&s.jobs.length)jobs=s.jobs;
    if(s.weekly_data)weeklyData=s.weekly_data;
    if(s.fgi_list&&s.fgi_list.length)fgiList=s.fgi_list;
    if(s.siding_entries&&s.siding_entries.length)sidingEntries=s.siding_entries;
    if(s.moh_history&&s.moh_history.length)mohHistory=s.moh_history;
    if(s.moh_rate)mohRate=s.moh_rate;
    // Rebuild the floor-model name map from persisted data (names live on jobs + fgi entries,
    // so no dedicated DB column is required). Defensively merge s.so_names if it ever exists.
    soNames={};
    if(s.so_names&&typeof s.so_names==='object')Object.keys(s.so_names).forEach(function(k){if(s.so_names[k])soNames[k]=s.so_names[k];});
    jobs.forEach(function(j){var nm=(j.name||'').trim();if(nm)soNames[String(j.so).trim()]=nm;});
    fgiList.forEach(function(f){var nm=(f.name||'').trim();if(nm&&!soNames[String(f.so).trim()])soNames[String(f.so).trim()]=nm;});
    // Rebuild _id counter to avoid collisions
    var maxId=0;
    jobs.forEach(function(j){if(j.id>maxId)maxId=j.id;});
    fgiList.forEach(function(f){if(f.id>maxId)maxId=f.id;});
    sidingEntries.forEach(function(e){if(e.id>maxId)maxId=e.id;});
    if(maxId>0)_id=maxId+1;
    var who=s.updated_by?' by '+s.updated_by:'';
    var when=s.updated_at?new Date(s.updated_at).toLocaleString():'';
    setStatus('\u2713 Loaded \u2014 last saved '+when+who,'#2dbd85');
    initApp();
  })
  .catch(function(e){
    setStatus('Load failed: '+e.message+' \u2014 working offline','#e24b4a');
    console.error('Supabase load error:',e);
    initApp();
  });
}

function initApp(){
  // Migration to the SEPARATE siding model: matTotal = pure materials, sidingTotal = the
  // island's siding (its own cost line), totalCost = mat + lab + moh + siding. Runs once
  // per entry (idempotent): skips entries that already satisfy the invariant.
  var fixed=0;
  fgiList.forEach(function(f){
    if(f.estimated){f.sidingTotal=0;f.costS=0;return;}
    var S=r2(getSidingCost(f.so));
    var invariantOk=Math.abs(((f.matTotal||0)+(f.labTotal||0)+(f.mohTotal||0)+(f.sidingTotal||0))-(f.totalCost||0))<0.03;
    if((f.sidingTotal||0)===S&&invariantOk)return; // already separated
    var built=jobs.some(function(j){return j.so===f.so&&j.wipCosts&&j.wipCosts.length;});
    if(built){
      // Authoritative rebuild from wipCosts (which never contain siding) => pure materials
      var m=0,l=0,o=0;
      jobs.filter(function(j){return j.so===f.so;}).forEach(function(j){j.wipCosts.forEach(function(c){m+=c.mat;l+=c.lab;o+=c.moh;});});
      f.matTotal=r2(m);f.labTotal=r2(l);f.mohTotal=r2(o);
      f.sidingTotal=S;f.costS=S;f.totalCost=r2(m+l+o+S);
    } else if(S>0){
      // Imported island: was siding folded into materials by a prior version? (_sidRec)
      if(f._sidRec){f.matTotal=r2(Math.max(0,(f.matTotal||0)-S));} // pull siding back out of materials
      else{f.totalCost=r2((f.totalCost||0)+S);}                    // never folded => add missing siding to total
      f.sidingTotal=S;f.costS=S;
    } else {f.sidingTotal=0;f.costS=0;}
    fixed++;
  });
  if(fixed>0)console.log('[Migration] Separated siding from materials for '+fixed+' entries.');
  rEntry();updateAllBadges();updateHdr();
}

// Wrap logAction so every action triggers a save
var _origLogAction=logAction;
logAction=function(action,detail,week){
  _origLogAction(action,detail,week);
  var entry=activityLog[0];
  saveLogEntry(entry);
  saveState();
};

// Boot
loadState();
</script>
