<style>
#lock-screen{position:fixed;inset:0;background:#0f0f0f;display:flex;align-items:center;justify-content:center;z-index:9999;}
#lock-box{text-align:center;width:280px;}

.lock-digit{width:52px;height:60px;background:#161616;border:1px solid #2a2a2a;border-radius:8px;font-size:28px;font-weight:600;color:#e8e8e8;text-align:center;}

#lock-err{font-size:12px;color:#e24b4a;min-height:18px;margin-bottom:12px;}

.shake{animation:shake .3s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}};
</style>
<div id="lock-screen">
  <div id="lock-box">
    <div style="font-size:36px;margin-bottom:14px;">🔒</div>
    <h2>KoKoMo Job Costing</h2>
    <p>Enter your 4-digit passcode</p>
    <div id="lock-digits">
      <input class="lock-digit" id="d1" type="password" maxlength="1" inputmode="numeric" oninput="lockNext(this,'d2')" onkeydown="lockKey(event,this,null,'d2')">
      <input class="lock-digit" id="d2" type="password" maxlength="1" inputmode="numeric" oninput="lockNext(this,'d3')" onkeydown="lockKey(event,this,'d1','d3')">
      <input class="lock-digit" id="d3" type="password" maxlength="1" inputmode="numeric" oninput="lockNext(this,'d4')" onkeydown="lockKey(event,this,'d2','d4')">
      <input class="lock-digit" id="d4" type="password" maxlength="1" inputmode="numeric" oninput="lockSubmit()" onkeydown="lockKey(event,this,'d3',null)">
    </div>
    <div id="lock-err"></div>
    <button id="lock-btn" onclick="checkPasscode()">Unlock</button>
  </div>
</div>
<script>
var PASS_VIEW='1325', PASS_EDIT='4615';
function lockNext(el,nextId){if(el.value&&nextId)document.getElementById(nextId).focus();}
function lockKey(e,el,prevId,nextId){
  if(e.key==='Backspace'&&!el.value&&prevId)document.getElementById(prevId).focus();
  if(e.key==='Enter')checkPasscode();
}
function lockSubmit(){
  var d4=document.getElementById('d4');
  if(d4.value)checkPasscode();
}
function checkPasscode(){
  var entered=['d1','d2','d3','d4'].map(function(i){return document.getElementById(i).value;}).join('');
  if(entered===PASS_EDIT||entered===PASS_VIEW){
    window.canEdit=(entered===PASS_EDIT);
    document.getElementById('lock-screen').style.display='none';
    applyAccessMode();
  } else {
    var err=document.getElementById('lock-err');
    err.textContent='Incorrect passcode. Try again.';
    var box=document.getElementById('lock-box');
    box.classList.remove('shake');
    void box.offsetWidth;
    box.classList.add('shake');
    ['d1','d2','d3','d4'].forEach(function(i){document.getElementById(i).value='';});
    document.getElementById('d1').focus();
    setTimeout(function(){err.textContent='';},2000);
  }
}
// Buttons whose onclick calls a data-mutating action — disabled in view-only mode.
var VIEW_MUT_RE=/saveMOH|saveMOHAllQuarters|adjustMOHForQtr|resetMOHForQtr|saveWk|saveWeek|addSO|addSiding|setSidingCost|deleteSidingEntry|editSidingDate|restoreEstimateValues|addHistoricalFloorModel|clearFMChecks|dedupeFGI|dedupeWIPCosts|recalcFGICosts|fixMissingWFt|cleanupOrphanedJobs|moveToFloorModel|closeShort|mvFGI|saveSOEdit|saveHist|deleteJob|delJob|removeJob|saveState|savePct|delSiding|setUser|addFloor|sellFloor/i;
function lockViewControls(){
  if(window.canEdit)return;
  document.querySelectorAll('button').forEach(function(btn){
    if(btn._vlocked)return;
    var oc=btn.getAttribute('onclick')||'';
    if(VIEW_MUT_RE.test(oc)){btn._vlocked=1;btn.disabled=true;btn.style.opacity='0.35';btn.style.cursor='not-allowed';btn.title='View-only mode — enter the edit passcode to make changes';}
  });
  document.querySelectorAll('input, textarea').forEach(function(inp){
    if(inp.closest('#lock-screen'))return;
    inp.readOnly=true;
  });
  document.querySelectorAll('select').forEach(function(s){s.disabled=true;});
}
function applyAccessMode(){
  var old=document.getElementById('access-badge');if(old)old.remove();
  var b=document.createElement('span');b.id='access-badge';
  b.textContent=window.canEdit?'EDIT MODE':'VIEW ONLY';
  b.style.cssText='font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;margin-left:10px;vertical-align:middle;'+(window.canEdit?'background:#0d2818;color:#2dbd85;border:1px solid #1a3a2a;':'background:#2a1a0d;color:#f0a030;border:1px solid #3a2a1a;');
  var h1=document.querySelector('.header h1');if(h1)h1.appendChild(b);
  if(!window.canEdit){
    document.body.classList.add('viewonly');
    lockViewControls();
    if(!window._voObserver){
      window._voObserver=new MutationObserver(function(){lockViewControls();});
      window._voObserver.observe(document.body,{childList:true,subtree:true});
    }
  }
}
document.addEventListener('DOMContentLoaded',function(){document.getElementById('d1').focus();});
</script>
<!-- END PASSCODE -->

<script>
var _id=1;
function nid(){return _id++;}
function r2(n){return Math.round((+n||0)*100)/100;}
function fmt(n){return'$'+r2(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function pclr(p){return p>=1?'#2dbd85':p>0?'#4a9eff':'#444';}
function nowStr(){return new Date().toLocaleString('en-US',{month:'short',day:'numeric',year:'2-digit',hour:'numeric',minute:'2-digit'});}
function getUser(){return document.getElementById('current-user')?.value||'Unknown';}

var DEPTS=['Framing','Tile','PSU'];
var DCLR={Framing:'#4a9eff',Tile:'#2dbd85',PSU:'#f0a030'};
var NEXT={Framing:'Tile',Tile:'PSU',PSU:null};
var mohRate=25.00;
var mohHistory=[];

// ── WEEK HELPERS — Sunday start, Saturday end ──
function getSun(dateStr){
  var d=new Date(dateStr+'T12:00:00');
  d.setDate(d.getDate()-d.getDay()); // roll to Sunday (day 0)
  return d.toISOString().split('T')[0];
}
// Split a week (keyed by its Sunday) across months by WORKDAYS (Mon-Fri only).
// Returns {'YYYY-MM': fraction, ...} summing to 1. A week entirely in one month
// returns {'YYYY-MM':1}. A boundary week (e.g. Mon-Tue May, Wed-Fri Jun) returns
// {'2026-05':0.4,'2026-06':0.6}. If somehow no workdays land, falls back to the
// Sunday's month = 1 so costs are never lost.
function weekMonthSplit(sunStr){
  var base=new Date(sunStr+'T12:00:00');
  var counts={};
  var totalWork=0;
  for(var i=1;i<=5;i++){ // Mon(+1) .. Fri(+5)
    var d=new Date(base.getTime());
    d.setDate(d.getDate()+i);
    var mo=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    counts[mo]=(counts[mo]||0)+1;
    totalWork++;
  }
  var split={};
  if(totalWork===0){split[sunStr.slice(0,7)]=1;return split;}
  Object.keys(counts).forEach(function(mo){split[mo]=counts[mo]/totalWork;});
  return split;
}
function wkRange(sunStr){
  var sun=new Date(sunStr+'T12:00:00');
  var sat=new Date(sunStr+'T12:00:00');
  sat.setDate(sat.getDate()+6);
  var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return M[sun.getMonth()]+' '+sun.getDate()+' \u2013 '+M[sat.getMonth()]+' '+sat.getDate();
}
function shiftWk(sunStr,n){
  var d=new Date(sunStr+'T12:00:00');
  d.setDate(d.getDate()+n*7);
  return d.toISOString().split('T')[0];
}
function todaySun(){return getSun(new Date().toISOString().split('T')[0]);}
function getQtr(sunStr){var d=new Date(sunStr+'T12:00:00');return d.getFullYear()+' Q'+(Math.floor(d.getMonth()/3)+1);}

var selWk={entry:todaySun(),Framing:todaySun(),Tile:todaySun(),PSU:todaySun(),history:todaySun()};
var jobs=[],weeklyData={},fgiList=[],activityLog=[],sidingEntries=[];
// Floor-model names, keyed by SO. A "floor model" is any SO with a 4-digit number.
// The name follows the SO across Framing -> Tile -> PSU and into inventory.
var soNames={};

// getSidingCost: total siding cost for a given SO
// sidingEntries: [{id, so, cost, date, note, option, linearFt, pending}]
//   pending:true = flagged from Tile/PSU with option + linearFt, cost not yet entered (counts as $0 until costed)
function getSidingCost(so){return sidingEntries.filter(function(e){return e.so===so;}).reduce(function(s,e){return s+(e.pending?0:(e.cost||0));},0);}
// Keep an island's siding as its OWN cost line (never merged into materials).
// Sets sidingTotal from live siding entries and rebuilds totalCost = mat+lab+moh+siding.
function syncFGISiding(so){
  fgiList.filter(function(f){return f.so===so;}).forEach(function(f){
    if(f.estimated)return;
    f.sidingTotal=r2(getSidingCost(so));f.costS=f.sidingTotal;
    f.totalCost=r2((f.matTotal||0)+(f.labTotal||0)+(f.mohTotal||0)+f.sidingTotal);
  });
}
function totalSidingInWIP(){
  return jobs.filter(function(j){return j.pct<1;}).reduce(function(s,j){return s+getSidingCost(j.so);},0);
}

function logAction(action,detail,week){
  activityLog.unshift({id:nid(),ts:nowStr(),user:getUser(),action:action,detail:detail,week:week||''});
}

mohRate=25.00;
function mkJob(so,wf,dept){return{id:nid(),so:String(so).trim(),wFt:r2(wf),dept:dept,pct:0,history:[],wipCosts:[]};}

// ── FLOOR MODEL NAMING ──
// A floor model is any SO whose number is exactly 4 digits (e.g. 5929, 5853).
function isFloorModelSO(so){return /^\d{4}$/.test(String(so||'').trim());}
// Single source of truth for an SO's name: soNames map first, then any FGI entry.
function getSOName(so){
  so=String(so||'').trim();
  if(soNames[so])return soNames[so];
  var j=jobs.find(function(x){return String(x.so).trim()===so&&(x.name||'').trim();});
  if(j)return j.name.trim();
  var f=fgiList.find(function(x){return x.so===so&&(x.name||'').trim();});
  return f?f.name.trim():'';
}
// Set (or clear) the name for an SO and sync it everywhere it's already used.
window.setSOName=function(so,val){
  so=String(so||'').trim();if(!so)return;
  var name=(val||'').trim();
  if(name)soNames[so]=name;else delete soNames[so];
  // Persist on the SO's job + FGI records (these save to existing DB columns, no schema change needed)
  jobs.forEach(function(j){if(String(j.so).trim()===so)j.name=name;});
  fgiList.forEach(function(f){if(String(f.so).trim()===so)f.name=name;});
  if(typeof refreshFMDatalists==='function')refreshFMDatalists();
  logAction('Named floor model','SO '+so+' \u2192 '+(name||'(cleared)'),'');
};

function byDept(d){return jobs.filter(function(j){return j.dept===d;});}
function activeJ(d){return byDept(d).filter(function(j){return j.pct<1;});}
function doneJ(d){return byDept(d).filter(function(j){return j.pct>=1;});}
function getWIP(job){return job.wipCosts.reduce(function(s,c){return{mat:s.mat+c.mat,lab:s.lab+c.lab,moh:s.moh+c.moh};},{mat:0,lab:0,moh:0});}
// Get all SOs still in production (not yet in FGI) with combined costs across all depts
function getWIPSummary(){
  var fgiSOs=fgiList.map(function(f){return f.so;});
  var soMap={};
  jobs.forEach(function(j){
    if(fgiSOs.indexOf(j.so)>=0)return; // already in FGI — out of WIP
    if(!soMap[j.so]){
      // Find the active dept for this SO (the one still in progress)
      var activeJ=jobs.filter(function(x){return x.so===j.so&&x.pct<1;});
      var activeDept=activeJ.length?activeJ[0].dept:j.dept;
      var activePct=activeJ.length?activeJ[0].pct:j.pct;
      var wFt=activeJ.length?activeJ[0].wFt:j.wFt;
      soMap[j.so]={so:j.so,wFt:wFt,dept:activeDept,pct:activePct,mat:0,lab:0,moh:0,siding:0};
    }
    var w=getWIP(j);
    soMap[j.so].mat=r2(soMap[j.so].mat+w.mat);
    soMap[j.so].lab=r2(soMap[j.so].lab+w.lab);
    soMap[j.so].moh=r2(soMap[j.so].moh+w.moh);
  });
  // Keep siding as its own cost line (not merged into materials), consistent with FGI/COGS
  Object.keys(soMap).forEach(function(so){
    soMap[so].siding=r2(getSidingCost(so));
  });
  return Object.values(soMap);
}
function totalReadyShipVal(){return fgiList.filter(function(f){return f.status==='fgi';}).reduce(function(s,f){return s+f.totalCost;},0);}
function totalWIPVal(){return getWIPSummary().reduce(function(s,r){return s+r.mat+r.lab+r.moh+r.siding;},0)+totalReadyShipVal();}
function totalFGIVal(){return fgiList.filter(function(f){return f.status==='fgi';}).reduce(function(s,f){return s+f.totalCost;},0);}

// MOH rate that applies to a given week = its quarter's current rate from mohHistory,
// falling back to the global rate for quarters that have no history entry yet.
function mohRateFor(sun){
  var h=mohHistory.find(function(x){return x.qtr===getQtr(sun);});
  return h?h.rate:mohRate;
}
function calcRates(dept,sun){
  // Always compute totalFt from history — ft stored as 0 on seeded data, so infer from pct delta
  var totalFt=r2(byDept(dept).reduce(function(s,j){
    var h=j.history.filter(function(x){return x.sun===sun;});
    if(!h.length)return s;
    var ft=h[0].ft;
    // If ft is 0 or impossibly large, infer from pct delta
    if(ft<=0||(ft>j.wFt&&j.wFt>0)){
      ft=r2(j.wFt*Math.max(0,(h[0].pctA||0)-(h[0].pctB||0)));
    }
    return s+ft;
  },0));

  var wd=weeklyData[sun]&&weeklyData[sun][dept];
  if(!wd)return{matR:0,labR:0,mohR:0,totR:0,totalFt:totalFt,moh:0,mat:0,burden:0,hrs:0};
  if(!totalFt)return{matR:0,labR:0,mohR:0,totR:0,totalFt:0,moh:r2((wd.hrs||0)*mohRateFor(sun)),mat:wd.mat||0,burden:wd.burden||0,hrs:wd.hrs||0};
  var moh=r2((wd.hrs||0)*mohRateFor(sun));
  var matR=r2((wd.mat||0)/totalFt),labR=r2((wd.burden||0)/totalFt),mohR=r2(moh/totalFt);
  return{matR:matR,labR:labR,mohR:mohR,totR:r2(matR+labR+mohR),totalFt:totalFt,moh:moh,mat:wd.mat||0,burden:wd.burden||0,hrs:wd.hrs||0};
}

function recalcWIPForWeek(dept,sun){
  var wd=weeklyData[sun]&&weeklyData[sun][dept];
  if(!wd)return;
  var deptJobs=byDept(dept).filter(function(j){return j.history.some(function(h){return h.sun===sun;});});
  // Compute effective ft per job — use inferred ft consistently in BOTH denominator and cost push
  var jobFts=deptJobs.map(function(j){
    var h=j.history.find(function(x){return x.sun===sun;});
    if(!h)return{j:j,ft:0};
    var ft=h.ft;
    if(ft<=0||(ft>j.wFt&&j.wFt>0))ft=r2(j.wFt*Math.max(0,(h.pctA||0)-(h.pctB||0)));
    return{j:j,ft:ft};
  });
  var totalFt=r2(jobFts.reduce(function(s,x){return s+x.ft;},0));
  if(!totalFt)return;
  var moh=r2((wd.hrs||0)*mohRateFor(sun));
  var matR=r2((wd.mat||0)/totalFt),labR=r2((wd.burden||0)/totalFt),mohR=r2(moh/totalFt);
  jobFts.forEach(function(x){
    x.j.wipCosts=x.j.wipCosts.filter(function(c){return!(c.sun===sun&&c.dept===dept);});
    if(x.ft>0)x.j.wipCosts.push({sun:sun,dept:dept,mat:r2(x.ft*matR),lab:r2(x.ft*labR),moh:r2(x.ft*mohR)});
  });
}

function promoteToPSU(job){
  var fJ=jobs.find(function(j){return j.so===job.so&&j.dept==='Framing';}),tJ=jobs.find(function(j){return j.so===job.so&&j.dept==='Tile';});
  var mT=0,lT=0,oT=0,cF=0,cT=0,cP=0;
  [fJ,tJ,job].forEach(function(x){if(!x)return;x.wipCosts.forEach(function(c){mT+=c.mat;lT+=c.lab;oT+=c.moh;if(x.dept==='Framing')cF+=c.mat+c.lab+c.moh;else if(x.dept==='Tile')cT+=c.mat+c.lab+c.moh;else cP+=c.mat+c.lab+c.moh;});});
  var sidingCost=getSidingCost(job.so);
  var data={so:job.so,name:getSOName(job.so),wFt:job.wFt,costF:r2(cF),costT:r2(cT),costP:r2(cP),costS:r2(sidingCost),matTotal:r2(mT),labTotal:r2(lT),mohTotal:r2(oT),sidingTotal:r2(sidingCost),totalCost:r2(mT+lT+oT+sidingCost),status:'fgi',source:'production'};
  // Idempotent: if this SO already has a ready-to-ship FGI entry, update it in place
  // (and drop any extra duplicates) instead of pushing a new one. Prevents duplicate
  // FGI rows when an island is completed more than once (e.g. re-completed after a
  // wrong-week edit).
  var existing=fgiList.filter(function(f){return f.so===job.so&&f.status==='fgi';});
  if(existing.length){
    Object.assign(existing[0],data);
    if(existing.length>1){
      var drop={};existing.slice(1).forEach(function(f){drop[f.id]=true;});
      fgiList=fgiList.filter(function(f){return!drop[f.id];});
      logAction('Merged duplicate FGI','SO '+job.so+' \u2014 removed '+(existing.length-1)+' duplicate entr'+(existing.length-1===1?'y':'ies'),'');
    }
    return;
  }
  fgiList.push(Object.assign({id:nid(),sun:todaySun()},data));
  logAction('Completed','SO '+job.so+' \u2192 FGI. Cost: '+fmt(r2(mT+lT+oT)),'');
}
function promote(job){
  var next=NEXT[job.dept];if(!next)return;
  if(!jobs.find(function(j){return j.so===job.so&&j.dept===next;})){
    var nj=mkJob(job.so,job.wFt,next);
    var nm=getSOName(job.so);if(nm)nj.name=nm;
    jobs.push(nj);
    logAction('Promoted','SO '+job.so+' \u2192 '+next,'');
  }
}

  // Quarterly history table with adjustment inputs

// Get the applied MOH rate for a given week (Sunday string)
// Looks up mohHistory for the quarter that week belongs to
function getMOHRateForWeek(sunStr){
  var qtr=getQtr(sunStr);
  var h=mohHistory.find(function(x){return x.qtr===qtr;});
  return h?h.rate:mohRate;
}

// Recalculate all WIP costs for every week in a given quarter using a new MOH rate
function recalcMOHForQuarter(qtr,newRate){
  // Find all weeks that belong to this quarter
  var weeksInQtr=Object.keys(weeklyData).filter(function(sun){return getQtr(sun)===qtr;});
  weeksInQtr.forEach(function(sun){
    DEPTS.forEach(function(dept){
      var wd=weeklyData[sun]&&weeklyData[sun][dept];
      if(!wd)return;
      var deptJobs=byDept(dept).filter(function(j){return j.history.some(function(h){return h.sun===sun;});});
      var totalFt=r2(deptJobs.reduce(function(s,j){var h=j.history.find(function(x){return x.sun===sun;});return s+(h?h.ft:0);},0));
      if(!totalFt)return;
      var moh=r2((wd.hrs||0)*newRate);
      var matR=r2((wd.mat||0)/totalFt),labR=r2((wd.burden||0)/totalFt),mohR=r2(moh/totalFt);
      deptJobs.forEach(function(j){
        // Remove old WIP entry for this week/dept and replace with new MOH rate
        j.wipCosts=j.wipCosts.filter(function(c){return!(c.sun===sun&&c.dept===dept);});
        var h=j.history.find(function(x){return x.sun===sun;});
        if(h&&h.ft>0)j.wipCosts.push({sun:sun,dept:dept,mat:r2(h.ft*matR),lab:r2(h.ft*labR),moh:r2(h.ft*mohR)});
      });
    });
  });
  // Rebuild every FGI/delivered/floor entry whose underlying WIP touched this quarter,
  // regardless of which quarter the island entered FGI (fixes cross-quarter drift).
  var affectedSOs={};
  jobs.forEach(function(j){
    if(j.wipCosts.some(function(c){return getQtr(c.sun)===qtr;}))affectedSOs[j.so]=true;
  });
  fgiList.forEach(function(f){
    if(f.estimated)return; // estimates are manually valued — never rebuild from jobs
    if(!affectedSOs[f.so])return;
    // Rebuild totals from updated wipCosts
    var allJ=jobs.filter(function(j){return j.so===f.so;});
    var mT=0,lT=0,oT=0,cF=0,cT=0,cP=0;
    allJ.forEach(function(j){j.wipCosts.forEach(function(c){mT+=c.mat;lT+=c.lab;oT+=c.moh;if(j.dept==='Framing')cF+=c.mat+c.lab+c.moh;else if(j.dept==='Tile')cT+=c.mat+c.lab+c.moh;else cP+=c.mat+c.lab+c.moh;});});
    var sid=getSidingCost(f.so);
    f.matTotal=r2(mT);f.labTotal=r2(lT);f.mohTotal=r2(oT);f.sidingTotal=r2(sid);
    f.costF=r2(cF);f.costT=r2(cT);f.costP=r2(cP);f.costS=r2(sid);
    f.totalCost=r2(mT+lT+oT+sid);
  });
}

// Build MOH variance report for a quarter
function getMOHVariance(qtr){
  var h=mohHistory.find(function(x){return x.qtr===qtr;});
  if(!h)return null;
  var appliedRate=h.appliedRate||h.rate; // original applied rate
  var actualRate=h.rate; // current (adjusted) rate
  if(appliedRate===actualRate)return null;

  var rows=[];
  var weeksInQtr=Object.keys(weeklyData).filter(function(sun){return getQtr(sun)===qtr;});
  jobs.forEach(function(j){
    var qtrWIP=j.wipCosts.filter(function(c){return weeksInQtr.indexOf(c.sun)>=0;});
    if(!qtrWIP.length)return;
    // Stored WIP MOH reflects the CURRENT (actual) rate after any adjustment.
    var actualMOH=r2(qtrWIP.reduce(function(s,c){return s+c.moh;},0));
    // Expected = what would have been charged at the original applied rate.
    // stored = hrs*actualRate, so expected = stored * (appliedRate/actualRate).
    var expectedMOH=actualRate>0?r2(actualMOH*(appliedRate/actualRate)):0;
    var variance=r2(actualMOH-expectedMOH);
    if(Math.abs(variance)>0.01)rows.push({so:j.so,dept:j.dept,wFt:j.wFt,pct:j.pct,expectedMOH:expectedMOH,actualMOH:actualMOH,variance:variance,status:j.pct>=1?'Completed':'In progress'});
  });
  return{appliedRate:appliedRate,actualRate:actualRate,rows:rows,
    totalVariance:r2(rows.reduce(function(s,r){return s+r.variance;},0))};
}

// Back out the MOH rate currently baked into stored WIP for a quarter (moh / hours).
// Used to preserve the originally-applied rate when a quarter has no history entry yet.
function impliedMOHRate(qtr){
  var weeks=Object.keys(weeklyData).filter(function(s){return getQtr(s)===qtr;});
  var hrs=weeks.reduce(function(s,sun){return s+DEPTS.reduce(function(ss,d){var wd=weeklyData[sun]&&weeklyData[sun][d];return ss+(wd?wd.hrs||0:0);},0);},0);
  if(!hrs)return mohRate;
  var moh=0;jobs.forEach(function(j){j.wipCosts.forEach(function(c){if(getQtr(c.sun)===qtr)moh+=c.moh;});});
  return r2(moh/hrs);
}

// Expected vs actual MOH rolled up by quarter (includes delivered islands, since
// delivered islands keep their completed job records and WIP costs).
function getQuarterlyMOHSummary(){
  var qset={};
  Object.keys(weeklyData).forEach(function(sun){qset[getQtr(sun)]=true;});
  mohHistory.forEach(function(h){qset[h.qtr]=true;});
  var out=Object.keys(qset).map(function(q){
    var weeks=Object.keys(weeklyData).filter(function(s){return getQtr(s)===q;});
    var hrs=r2(weeks.reduce(function(s,sun){return s+DEPTS.reduce(function(ss,d){var wd=weeklyData[sun]&&weeklyData[sun][d];return ss+(wd?wd.hrs||0:0);},0);},0));
    var actMOH=0;jobs.forEach(function(j){j.wipCosts.forEach(function(c){if(getQtr(c.sun)===q)actMOH+=c.moh;});});
    actMOH=r2(actMOH);
    var h=mohHistory.find(function(x){return x.qtr===q;});
    var actRate=hrs>0?r2(actMOH/hrs):(h?h.rate:mohRate);
    var expRate=h?(h.appliedRate||h.rate):actRate;
    var expMOH=r2(hrs*expRate);
    var varDollar=r2(actMOH-expMOH);
    var varPct=expMOH>0?r2(varDollar/expMOH*100):0;
    return{qtr:q,hrs:hrs,expRate:expRate,actRate:actRate,expMOH:expMOH,actMOH:actMOH,varDollar:varDollar,varPct:varPct};
  }).filter(function(r){return r.hrs>0||r.expRate!==r.actRate;});
  out.sort(function(a,b){return b.qtr.localeCompare(a.qtr);});
  return out;
}

window.saveMOH=function(){

window.saveMOHAllQuarters=function(){
  var v=+document.getElementById('moh-inp')?.value;if(!v||v<=0){alert('Enter a valid rate.');return;}
  var nr=r2(v);
  var qset={};
  Object.keys(weeklyData).forEach(function(sun){qset[getQtr(sun)]=true;});
  mohHistory.forEach(function(h){qset[h.qtr]=true;});
  var qs=Object.keys(qset);
  if(!qs.length){alert('No quarters with cost data yet.');return;}
  if(!confirm('Apply '+fmt(nr)+'/hr as the MOH rate to ALL '+qs.length+' quarter(s)?\n\nThis rebuilds WIP, FGI and already-delivered island costs everywhere. The originally-applied rate is preserved for the expected-vs-actual report.'))return;
  qs.forEach(function(q){
    var h=mohHistory.find(function(x){return x.qtr===q;});
    if(h){
      if(!h.appliedRate)h.appliedRate=h.rate; // lock original before changing
      h.rate=nr;
    } else {
      // No history yet: capture the rate currently baked into WIP as the applied/expected rate
      mohHistory.push({qtr:q,rate:nr,appliedRate:impliedMOHRate(q),date:todaySun()});
    }
    recalcMOHForQuarter(q,nr);
  });
  mohRate=nr;
  logAction('MOH set for all quarters',fmt(nr)+'/hr applied across '+qs.length+' quarter(s) \u2014 WIP, FGI and delivered recalculated','');
  rMOH();rEntry();rWIP();rFGI();rPL();
  alert('\u2713 '+fmt(nr)+'/hr applied to '+qs.length+' quarter(s). All WIP, FGI and delivered island costs rebuilt.');
}

window.adjustMOHForQtr=function(qtr){
  var inp=document.getElementById('adj-rate-'+qtr);if(!inp)return;
  var newRate=r2(+inp.value||0);if(!newRate||newRate<=0){alert('Enter a valid rate.');return;}
  var h=mohHistory.find(function(x){return x.qtr===qtr;});
  if(!h){alert('No rate history for '+qtr);return;}
  var oldRate=h.rate;
  if(!h.appliedRate)h.appliedRate=h.rate; // lock original
  h.rate=newRate;
  // Recalculate all WIP and FGI for this quarter
  recalcMOHForQuarter(qtr,newRate);
  logAction('MOH quarterly adjustment',qtr+': '+fmt(oldRate)+'/hr \u2192 '+fmt(newRate)+'/hr \u2014 WIP and FGI recalculated','');
  // Update current mohRate if this is the current quarter
  if(qtr===getQtr(todaySun()))mohRate=newRate;
  rMOH();rEntry();rWIP();rFGI();rPL();
  var msg=document.getElementById('adj-msg-'+qtr);
  if(msg)msg.textContent='\u2713 Recalculated \u2014 WIP, FGI and P&L updated';
}

window.resetMOHForQtr=function(qtr){
  var h=mohHistory.find(function(x){return x.qtr===qtr;});
  if(!h||!h.appliedRate)return;
  var orig=h.appliedRate;
  h.rate=orig;
  recalcMOHForQuarter(qtr,orig);
  logAction('MOH reset to applied',qtr+': reset to original '+fmt(orig)+'/hr','');
  if(qtr===getQtr(todaySun()))mohRate=orig;
  rMOH();rEntry();rWIP();rFGI();rPL();
}

  if(m)m.textContent='\u2713 Updated \u2014 WIP recalculated'+(fgiUpdated?' \u00b7 '+fgiUpdated+' FGI entries cascaded':'');
  rHistory();rWIP();if(fgiUpdated){rFGI();rPL();}

// Recalculate full history chain for a job after any past edit
// Ensures pctB of each week = pctA of the prior week, and ft = wFt * (pctA - pctB)
// Then recalculates WIP costs for every affected week
function recalcJobHistoryChain(j,dept){
  // Sort history chronologically
  j.history.sort(function(a,b){return a.sun.localeCompare(b.sun);});
  var prevPctA=0;
  j.history.forEach(function(h){
    h.pctB=prevPctA;
    h.ft=r2(j.wFt*Math.max(0,h.pctA-prevPctA));
    prevPctA=h.pctA;
  });
  // j.pct = the highest pctA in history
  if(j.history.length)j.pct=j.history[j.history.length-1].pctA; // history is sorted chronologically here
  // Recalculate WIP costs for every week in history
  var weeks=j.history.map(function(h){return h.sun;});
  var seen={};
  weeks.forEach(function(sun){
    if(seen[sun])return;seen[sun]=true;
    recalcWIPForWeek(dept,sun);
  });
}

window.saveSOEdit=function(jid,sun,dept){
  var j=jobs.find(function(x){return x.id===jid;});if(!j)return;
  var soInp=document.getElementById('he-so-'+jid);
  var wftInp=document.getElementById('he-wft-'+jid);
  var pctInp=document.getElementById('he-pct-'+jid);
  var changes=[];

  // Update SO number
  if(soInp&&soInp.value.trim()&&soInp.value.trim()!==j.so){
    var oldSO=j.so;
    j.so=soInp.value.trim();
    fgiList.forEach(function(f){if(f.so===oldSO)f.so=j.so;});
    sidingEntries.forEach(function(e){if(e.so===oldSO)e.so=j.so;});
    changes.push('SO: '+oldSO+'\u2192'+j.so);
  }

  // Update weighted footage — scale all history ft and WIP costs
  if(wftInp){
    var newWFt=r2(+wftInp.value||0);
    if(newWFt>0&&newWFt!==j.wFt){
      var oldWFt=j.wFt;
      j.wFt=newWFt;
      // Recalc ft from pct (more accurate than scaling)
      j.history.sort(function(a,b){return a.sun.localeCompare(b.sun);});
      var prev=0;
      j.history.forEach(function(h){h.pctB=prev;h.ft=r2(newWFt*Math.max(0,h.pctA-prev));prev=h.pctA;});
      // Scale WIP costs proportionally
      var ratio=oldWFt>0?newWFt/oldWFt:1;
      j.wipCosts.forEach(function(c){c.mat=r2(c.mat*ratio);c.lab=r2(c.lab*ratio);c.moh=r2(c.moh*ratio);});
      changes.push('Wt ft: '+oldWFt+'\u2192'+newWFt);
    }
  }

  // Update percentage for the selected week — then cascade forward
  if(pctInp){
    var newPct=Math.min(1,Math.max(0,(+pctInp.value||0)/100));
    var h=j.history.find(function(x){return x.sun===sun;});
    if(!h){
      // No history entry for this week — create one
      j.history.push({sun:sun,pctB:0,pctA:newPct,ft:0});
      h=j.history.find(function(x){return x.sun===sun;});
    }
    var oldPct=h.pctA;
    if(oldPct!==newPct){
      h.pctA=newPct;
      // Cascade: recalc the entire chain so all subsequent weeks update correctly
      recalcJobHistoryChain(j,dept);
      changes.push('%: '+Math.round(oldPct*100)+'%\u2192'+Math.round(newPct*100)+'% \u2014 all subsequent weeks recalculated');
      // Keep FGI in sync with PSU completion after the edit (prevents orphaned/duplicate
      // FGI entries when an island is edited below 100% and later re-completed).
      var psuJob=jobs.find(function(x){return x.so===j.so&&x.dept==='PSU';});
      var psuDone=!!(psuJob&&psuJob.pct>=1);
      var hasReadyFGI=fgiList.some(function(f){return f.so===j.so&&f.status==='fgi';});
      var anyFinished=fgiList.some(function(f){return f.so===j.so;});
      if(!psuDone&&hasReadyFGI){
        fgiList=fgiList.filter(function(f){return!(f.so===j.so&&f.status==='fgi');});
        changes.push('removed from FGI \u2014 returned to WIP');
      } else if(psuDone&&!anyFinished){
        promoteToPSU(psuJob);
        changes.push('added to FGI');
      }
    }
  }

  if(changes.length){
    logAction('Edited SO','SO '+j.so+' ('+dept+') \u2014 '+changes.join(', '),sun);
    rWIP();rFGI();rPL();
  }
  rHistory();
}

// Close Short — marks island as complete at current % without requiring 100%
// Weighted footage stops accumulating — only footage produced so far counts
// Island moves to FGI (via PSU complete path) or next dept is skipped
window.closeShort=function(jid,dept){
  var j=jobs.find(function(x){return x.id===jid;});if(!j)return;
  var actualFt=r2(j.wFt*j.pct);
  var confirmMsg='Close SO '+j.so+' short in '+dept+'?\n\n'
    +'Footage produced: '+actualFt+' of '+j.wFt+' wt ft\n'
    +(dept==='Tile'?'Island will move to PSU with '+actualFt+' ft.':'Island will move to FGI with '+actualFt+' ft.');
  if(!confirm(confirmMsg))return;
  // Freeze wFt at actual footage produced
  j.closedShort=true;
  j.wFtOriginal=j.wFt;
  j.wFt=actualFt>0?actualFt:j.wFt;
  j.pct=1;
  if(j.wFtOriginal>0&&actualFt>0&&actualFt!==j.wFtOriginal){
    var ratio=actualFt/j.wFtOriginal;
    j.wipCosts.forEach(function(c){c.mat=r2(c.mat*ratio);c.lab=r2(c.lab*ratio);c.moh=r2(c.moh*ratio);});
  }
  if(dept==='Tile'){
    // Move to PSU as an ACTIVE job — not completed, PSU still needs to run
    if(!jobs.find(function(x){return x.so===j.so&&x.dept==='PSU';})){
      var psuJ=mkJob(j.so,j.wFt,'PSU');
      psuJ.closedShort=true;
      jobs.push(psuJ);
    }
    logAction('Closed short in Tile','SO '+j.so+' — '+actualFt+' ft counted → moved to PSU','');
  } else if(dept==='PSU'){
    // Close short in PSU — goes straight to FGI
    promoteToPSU(j);
    logAction('Closed short in PSU','SO '+j.so+' — '+actualFt+' ft counted → FGI','');
  }
  rDept(dept);rDept('PSU');updateAllBadges();updateHdr();rFGI();
}

// Move PSU island to floor model at current completion (no 100% required)
window.moveToFloorModel=function(jid){
  var j=jobs.find(function(x){return x.id===jid;});if(!j||j.dept!=='PSU')return;
  var actualFt=r2(j.wFt*j.pct);
  if(!confirm('Move SO '+j.so+' to floor model inventory?\n\nPSU is '+Math.round(j.pct*100)+'% complete ('+actualFt+' of '+j.wFt+' ft).\nThe island will sit in floor model inventory. When sold, it returns to PSU for completion.'))return;
  // Freeze wFt at actual produced
  j.wFtOriginal=j.wFtOriginal||j.wFt;
  j.wFt=actualFt>0?actualFt:j.wFt;
  j.pct=1;j.floorModelPending=true;
  // Build FGI entry as floor model directly
  var fJ=jobs.find(function(x){return x.so===j.so&&x.dept==='Framing';}),tJ=jobs.find(function(x){return x.so===j.so&&x.dept==='Tile';});

// Return floor model to PSU for completion
window.returnToPSU=function(fid){
  var f=fgiList.find(function(x){return x.id===fid;});if(!f)return;
  if(!confirm('Return SO '+f.so+' to PSU for completion?\n\nThe island will re-enter PSU as an active job. When PSU is complete, it will move to FGI for delivery.'))return;
  // Remove from fgiList
  fgiList=fgiList.filter(function(x){return x.id!==fid;});
  // Find or create PSU job
  var psuJ=jobs.find(function(j){return j.so===f.so&&j.dept==='PSU';});
  if(psuJ){
    psuJ.pct=0;psuJ.floorModelPending=false;
  } else {
    psuJ=mkJob(f.so,f.wFt,'PSU');
    jobs.push(psuJ);
  }
  logAction('Returned to PSU','SO '+f.so+' returned from floor model inventory to PSU for completion','');
  rFGI();rDept('PSU');updateAllBadges();updateHdr();rWIP();
}

// Track which SOs completed during the most recent week save per dept
var completedThisWk={Framing:[],Tile:[],PSU:[]};

// Get the most recent pctA for a job BEFORE a given week (chronological, not array order)
function getLastPct(job,beforeSun){
  var prior=job.history.filter(function(h){return h.sun<beforeSun;}).sort(function(a,b){return b.sun.localeCompare(a.sun);});
  return prior.length?prior[0].pctA:0;
}
// Get the current total pct — highest pctA across all history entries
function getCurrentPct(job){
  if(!job.history.length)return job.pct||0;
  var sorted=job.history.slice().sort(function(a,b){return b.sun.localeCompare(a.sun);});
  return sorted[0].pctA;
}

window.ppct=function(dept,jid,val){
  var j=jobs.find(function(x){return x.id===jid;});if(!j)return;
  var sun=selWk[dept];
  var np=Math.min(1,Math.max(0,(+val||0)/100)),lp=getLastPct(j,sun);
  var ft=r2(j.wFt*Math.max(0,np-lp));
  var fe=document.getElementById('fp-'+jid);if(fe)fe.textContent=ft>0?ft:'—';
  var pf=document.getElementById('pf-'+jid);if(pf){pf.style.width=Math.round(np*100)+'%';pf.style.background=pclr(np);}
}
window.saveWk=function(dept){
  var sun=selWk[dept],act=activeJ(dept),wd=weeklyData[sun]&&weeklyData[sun][dept];
  var deltas=[];
  act.forEach(function(j){
    var inp=document.querySelector('#jr-'+j.id+' input[type=number]');if(!inp)return;
    var np=Math.min(1,Math.max(0,(+inp.value||0)/100)),lp=getLastPct(j,sun);
    deltas.push({j:j,np:np,lp:lp,ft:r2(j.wFt*Math.max(0,np-lp))});
  });
  // Step 1: Update history entries for all active islands being saved this week
  var promoted=0,soList=[];
  completedThisWk[dept]=[];
  deltas.forEach(function(d){
    d.j.pct=d.np;
    // Remove any existing history entry for this week before pushing (prevents duplicates)
    d.j.history=d.j.history.filter(function(h){return h.sun!==sun;});
    d.j.history.push({sun:sun,pctB:d.lp,pctA:d.np,ft:d.ft});
    soList.push(d.j.so+' '+Math.round(d.np*100)+'%');
    if(d.np>=1){
      promote(d.j);promoted++;if(dept==='PSU')promoteToPSU(d.j);
    }
  });

  // Step 2: Recalculate wipCosts for ALL islands in this dept/week together
  // This prevents double-counting when a week is saved in multiple separate calls
  recalcWIPForWeek(dept,sun);

  // Step 3: Build completedThisWk from history (now that wipCosts are correct)
  var totalCost=0;
  deltas.forEach(function(d){
    var wip=d.j.wipCosts.filter(function(c){return c.sun===sun&&c.dept===dept;}).reduce(function(s,c){return s+c.mat+c.lab+c.moh;},0);
    totalCost+=wip;
    if(d.np>=1){
      completedThisWk[dept].push({so:d.j.so,wFt:d.j.wFt,ft:d.ft,cost:r2(wip)});
    }
  });
  var nFt=r2(deltas.reduce(function(s,d){return s+d.ft;},0));
  if(soList.length)logAction('Saved dept week',dept+' \u2014 '+wkRange(sun)+' \u2014 '+soList.join(', ')+(totalCost>0?' \u2014 '+fmt(r2(totalCost))+' to WIP':''),sun);
  var msg=document.getElementById('wm-'+dept);
  if(msg)msg.textContent='\u2713 '+wkRange(sun)+' \u2014 '+nFt+' ft'+(totalCost>0?' \u00b7 '+fmt(r2(totalCost))+' to WIP':'')+(promoted?' \u00b7 '+promoted+' \u2192 '+(NEXT[dept]||'FGI'):'');
  rDept(dept);var nd=NEXT[dept];if(nd)rDept(nd);updateAllBadges();updateHdr();if(dept==='PSU')rFGI();
}
window.addJob=function(dept){
  var so=document.getElementById('nso-'+dept)?.value?.trim(),wf=+document.getElementById('nwft-'+dept)?.value||0;
  var nm=document.getElementById('nname-'+dept)?.value?.trim()||'';
  if(!so){alert('SO required.');return;}if(!wf){alert('Weighted footage required.');return;}
  if(jobs.find(function(j){return j.so===so&&j.dept===dept;})){alert('SO '+so+' already in '+dept+'.');return;}
  jobs.push(mkJob(so,wf,dept));
  logAction('Added SO','SO '+so+' ('+wf+' wt ft) added to '+dept,'');
  // Apply model name if given — only meaningful for 4-digit floor-model SOs
  if(nm){
    if(isFloorModelSO(so))setSOName(so,nm);
    else alert('Note: "'+nm+'" was not saved as a floor model name because SO '+so+' is not a 4-digit floor model. The SO was still added.');
  }
  document.getElementById('nso-'+dept).value='';document.getElementById('nwft-'+dept).value='';
  var ni=document.getElementById('nname-'+dept);if(ni)ni.value='';
  rDept(dept);updateAllBadges();updateHdr();
}

window.deleteSidingEntry=function(eid){

// Repair jobs where wFt is 0/missing on a dept but other depts for the same SO have a valid wFt
// This causes footage inference to fail (ft = wFt * delta = 0) and silently drops costs
// Remove orphaned active job entries for SOs that already exist in fgiList
// These leftovers cause stale "active" status to show in Siding/other tabs
// even though the island has already moved to FGI/delivered
window.cleanupOrphanedJobs=function(){
  var fgiSOs={};
  fgiList.forEach(function(f){fgiSOs[f.so]=true;});
  var toRemove=jobs.filter(function(j){return j.pct<1&&fgiSOs[j.so];});
  if(!toRemove.length){alert('No orphaned active jobs found.');return;}
  var labels=toRemove.map(function(j){return j.so+' ('+j.dept+', '+Math.round(j.pct*100)+'%)';});
  if(!confirm('Found '+toRemove.length+' orphaned active job(s) for SOs already in FGI:\n\n'+labels.slice(0,15).join('\n')+(labels.length>15?'\n...+'+(labels.length-15)+' more':'')+'\n\nRemove them?'))return;
  jobs=jobs.filter(function(j){return!(j.pct<1&&fgiSOs[j.so]);});
  logAction('Cleaned orphaned jobs',toRemove.length+' stray active jobs removed: '+labels.join(', '),'');
  updateAllBadges();updateHdr();rSiding();rDept('Framing');rDept('Tile');rDept('PSU');
  alert('\u2713 Removed '+toRemove.length+' orphaned job(s).');
}

window.fixMissingWFt=function(){
  var fixed=[];
  var soGroups={};
  jobs.forEach(function(j){
    if(!soGroups[j.so])soGroups[j.so]=[];
    soGroups[j.so].push(j);
  });
  Object.keys(soGroups).forEach(function(so){
    var group=soGroups[so];
    var validWFt=group.map(function(j){return j.wFt;}).filter(function(w){return w>0;});
    if(!validWFt.length)return;
    var correctWFt=Math.max.apply(null,validWFt); // use the largest valid wFt found
    group.forEach(function(j){
      if(!j.wFt||j.wFt<=0){
        j.wFt=correctWFt;
        fixed.push(j.so+' ('+j.dept+'): 0 \u2192 '+correctWFt);
        // Recalculate history ft now that wFt is correct
        recalcJobHistoryChain(j,j.dept);
      }
    });
  });
  if(!fixed.length){
    alert('No missing wFt issues found.');
    return;
  }
  if(!confirm('Found '+fixed.length+' job(s) with missing weighted footage:\n\n'+fixed.slice(0,15).join('\n')+(fixed.length>15?'\n...+'+(fixed.length-15)+' more':'')+'\n\nFix and recalculate WIP/FGI costs?'))return;

  // Recalc WIP costs for all affected weeks
  var weeks=Object.keys(weeklyData).sort();
  var depts=['Framing','Tile','PSU'];
  weeks.forEach(function(sun){depts.forEach(function(dept){
    if(weeklyData[sun]&&weeklyData[sun][dept])recalcWIPForWeek(dept,sun);
  });});

  // Rebuild FGI entries
  fgiList.forEach(function(f){
    if(f.estimated)return; // estimates are manually valued — never rebuild from jobs
    var allJ=jobs.filter(function(j){return j.so===f.so;});
    var mT=0,lT=0,oT=0,cF=0,cT=0,cP=0;
    allJ.forEach(function(j){j.wipCosts.forEach(function(c){
      mT+=c.mat;lT+=c.lab;oT+=c.moh;
      if(j.dept==='Framing')cF+=c.mat+c.lab+c.moh;
      else if(j.dept==='Tile')cT+=c.mat+c.lab+c.moh;
      else cP+=c.mat+c.lab+c.moh;
    });});
    var sid=getSidingCost(f.so);
    f.matTotal=r2(mT);f.labTotal=r2(lT);f.mohTotal=r2(oT);f.sidingTotal=r2(sid);
    f.costF=r2(cF);f.costT=r2(cT);f.costP=r2(cP);f.costS=r2(sid);
    f.totalCost=r2(mT+lT+oT+sid);
  });

  logAction('Fixed missing wFt',fixed.length+' jobs repaired: '+fixed.join(', '),'');
  rFGI();rWIP();rPL();updateAllBadges();updateHdr();
  alert('\u2713 Fixed '+fixed.length+' job(s) and recalculated all costs.');
}

window.dedupeFGI=function(){
  // Collapse duplicate ready-to-ship ('fgi') rows for the same SO, keeping the one with
  // the highest total cost (most complete). Leaves delivered/floor-model entries alone
  // and does NOT recompute any costs or MOH rates.
  var keeper={};
  fgiList.forEach(function(f){
    if(f.status!=='fgi')return;
    if(!keeper[f.so]||f.totalCost>keeper[f.so].totalCost)keeper[f.so]=f;
  });
  var removed=0,kept=[];
  fgiList.forEach(function(f){
    if(f.status==='fgi'&&keeper[f.so]!==f){removed++;return;}
    kept.push(f);
  });
  if(!removed){alert('No duplicate FGI entries found.');return;}
  if(!confirm('Remove '+removed+' duplicate ready-to-ship FGI entr'+(removed===1?'y':'ies')+'?\n\nCosts and MOH rates are not changed \u2014 this only removes the extra rows.'))return;
  fgiList=kept;
  logAction('Removed duplicate FGI',removed+' duplicate ready-to-ship entr'+(removed===1?'y':'ies')+' removed','');
  rFGI();rPL();
  alert('\u2713 Removed '+removed+' duplicate FGI entr'+(removed===1?'y':'ies')+'.');
}

window.recalcFGICosts=function(){
  var updated=0;
  fgiList.forEach(function(f){
    if(f.estimated)return; // estimates are manually valued — never rebuild from jobs
    var allJ=jobs.filter(function(j){return j.so===f.so;});
    if(!allJ.length)return;
    var mT=0,lT=0,oT=0,cF=0,cT=0,cP=0;
    allJ.forEach(function(j){
      j.wipCosts.forEach(function(c){
        mT+=c.mat;lT+=c.lab;oT+=c.moh;
        if(j.dept==='Framing')cF+=c.mat+c.lab+c.moh;
        else if(j.dept==='Tile')cT+=c.mat+c.lab+c.moh;
        else cP+=c.mat+c.lab+c.moh;
      });
    });
    var sid=getSidingCost(f.so);
    var newTotal=r2(mT+lT+oT+sid);
    if(newTotal!==f.totalCost){updated++;}
    f.matTotal=r2(mT);f.labTotal=r2(lT);f.mohTotal=r2(oT);f.sidingTotal=r2(sid);
    f.costF=r2(cF);f.costT=r2(cT);f.costP=r2(cP);f.costS=r2(sid);
    f.totalCost=newTotal;
  });
  logAction('Recalculated FGI costs',updated+' of '+fgiList.length+' entries updated from WIP costs','');
  rFGI();rWIP();rPL();
  alert('\u2713 Done — '+updated+' FGI entr'+(updated===1?'y':'ies')+' updated with accumulated WIP costs.');
}

window.restoreEstimateValues=function(){
  var est=fgiList.filter(function(f){return f.status==='floormodel'&&f.estimated;});

  var rateStr=prompt('Set each estimated floor-model value to weighted ft \u00d7 rate.\n\nEnter the blended rate per ft (materials + labor + MOH):','236');
  if(rateStr===null)return;
  var rate=parseFloat(rateStr);

  var n=0,missing=0;

window.exportFloorModelsCSV=function(){
  var floor=fgiList.filter(function(f){return f.status==='floormodel';});
  if(!floor.length){alert('No floor models to export.');return;}
  // Sort: tracked first, then by location, then by name/SO
  floor.sort(function(a,b){
    if(!!a.estimated!==!!b.estimated)return a.estimated?1:-1;
    var la=(a.location||'').toLowerCase(),lb=(b.location||'').toLowerCase();
    if(la!==lb)return la<lb?-1:1;
    return String(a.name||a.so).localeCompare(String(b.name||b.so));
  });
  var header=['SO','Name','Location','Wt Ft','Materials','Labor','MOH','Total Cost','$/Ft','Cost Type','In Financials'];
  var rows=floor.map(function(f){
    var perFt=f.wFt>0?r2(f.totalCost/f.wFt):0;
    return [
      f.so||'',
      f.name||'',
      f.location||'',
      f.wFt||0,
      r2(f.matTotal||0),
      r2(f.labTotal||0),
      r2(f.mohTotal||0),
      r2(f.totalCost||0),
      perFt,
      f.estimated?'ESTIMATE':'Actual',
      f.estimated?'No - excluded':'Yes'
    ];
  });
  // Totals
  var tReal=floor.filter(function(f){return!f.estimated;}).reduce(function(s,f){return s+f.totalCost;},0);
  var tEst=floor.filter(function(f){return f.estimated;}).reduce(function(s,f){return s+f.totalCost;},0);
  rows.push([]);
  rows.push(['','','','','','','','TOTAL (actual, in financials)','','',r2(tReal)]);
  rows.push(['','','','','','','','TOTAL (estimated, excluded)','','',r2(tEst)]);
  rows.push(['','','','','','','','TOTAL (all floor models)','','',r2(tReal+tEst)]);

  var all=[header].concat(rows);
  var csv=all.map(function(r){return r.map(function(c){return typeof c==='number'?c:'"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='kokomo_floor_models_'+todaySun()+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  logAction('Exported floor models CSV',floor.length+' floor models downloaded','');
}

// Full WIP cost rebuild — wipes all wipCosts and recalculates from weekly data + history
// This is the nuclear fix for inflated totals
window.diagnoseCosts=function(){
  var soCount={};
  fgiList.forEach(function(f){soCount[f.so]=(soCount[f.so]||0)+1;});
  var dupes=Object.keys(soCount).filter(function(so){return soCount[so]>1;});
  var snap=JSON.parse(JSON.stringify(jobs));
  var snapFgi=JSON.parse(JSON.stringify(fgiList));
  jobs.forEach(function(j){j.wipCosts=[];});
  var weeks=Object.keys(weeklyData).sort();
  var depts=['Framing','Tile','PSU'];var processed=0;
  weeks.forEach(function(sun){depts.forEach(function(dept){
    if(weeklyData[sun]&&weeklyData[sun][dept]){recalcWIPForWeek(dept,sun);processed++;}
  });});
  var totMat=0,totLab=0,totMoh=0;
  jobs.forEach(function(j){j.wipCosts.forEach(function(c){totMat+=c.mat;totLab+=c.lab;totMoh+=c.moh;});});
  // Dedup fgiList in memory
  var seenSO={};
  var dedupedFgi=fgiList.filter(function(f){
    if(f.status!=='fgi')return true;
    if(seenSO[f.so])return false;
    seenSO[f.so]=true;return true;
  });
  var savedFgi=fgiList;fgiList=dedupedFgi;
  fgiList.forEach(function(f){
    if(f.estimated)return; // estimates are manually valued — never rebuild from jobs
    var allJ=jobs.filter(function(j){return j.so===f.so;});
    var mT=0,lT=0,oT=0;
    allJ.forEach(function(j){j.wipCosts.forEach(function(c){mT+=c.mat;lT+=c.lab;oT+=c.moh;});});
    f.totalCost=r2(mT+lT+oT+getSidingCost(f.so));
  });
  var fgiTotal=r2(fgiList.filter(function(f){return f.status==='fgi';}).reduce(function(s,f){return s+f.totalCost;},0));
  var wipTotal=r2(totalWIPVal());
  var msg='=== DIAGNOSTIC (not saved) ===\n\n'
    +'FGI entries: '+savedFgi.length+' ('+dupes.length+' duplicate SOs)\n'
    +(dupes.length>0?'Dupes: '+dupes.slice(0,8).join(', ')+'\n':'')
    +'\nAfter rebuild + dedup:\n'
    +'  wipCosts total: $'+r2(totMat+totLab+totMoh).toLocaleString()+'\n'
    +'  WIP: $'+wipTotal.toLocaleString()+'\n'
    +'  FGI: $'+fgiTotal.toLocaleString()+'\n'
    +'  Combined: $'+r2(wipTotal+fgiTotal).toLocaleString()+'\n\n'
    +'Weeks: '+weeks.length+' ('+processed+' dept/week combos)\n'
    +'Jobs with wipCosts: '+jobs.filter(function(j){return j.wipCosts.length>0;}).length+' of '+jobs.length;
  console.log(msg);alert(msg);
  // Restore
  fgiList=savedFgi;
  jobs.splice(0,jobs.length);snap.forEach(function(j){jobs.push(j);});
}

window.dedupeWIPCosts=function(){
  if(!confirm('FULL COST REBUILD\n\n1. Remove duplicate FGI entries\n2. Clear all wipCosts\n3. Recalculate from Weekly Entry data\n4. Rebuild FGI costs\n\nProceed?'))return;
  var log=[];
  // Step 0: Dedup fgiList
  var before=fgiList.length;
  var seenSO={};
  fgiList=fgiList.filter(function(f){
    if(f.status!=='fgi')return true;
    if(seenSO[f.so])return false;
    seenSO[f.so]=true;return true;
  });
  log.push('FGI dedup: removed '+(before-fgiList.length)+' duplicate entries');
  // Step 1: Wipe
  var wiped=0;
  jobs.forEach(function(j){wiped+=j.wipCosts.length;j.wipCosts=[];});
  log.push('Wiped '+wiped+' wipCost entries');
  // Step 2: Rebuild
  var weeks=Object.keys(weeklyData).sort();
  var depts=['Framing','Tile','PSU'];var processed=0;
  weeks.forEach(function(sun){depts.forEach(function(dept){
    if(weeklyData[sun]&&weeklyData[sun][dept]){recalcWIPForWeek(dept,sun);processed++;}
  });});
  log.push('Rebuilt '+processed+' dept/week combos');
  // Step 3: Rebuild FGI costs
  fgiList.forEach(function(f){
    if(f.estimated)return; // estimates are manually valued — never rebuild from jobs
    var allJ=jobs.filter(function(j){return j.so===f.so;});
    var mT=0,lT=0,oT=0,cF=0,cT=0,cP=0;
    allJ.forEach(function(j){j.wipCosts.forEach(function(c){
      mT+=c.mat;lT+=c.lab;oT+=c.moh;
      if(j.dept==='Framing')cF+=c.mat+c.lab+c.moh;
      else if(j.dept==='Tile')cT+=c.mat+c.lab+c.moh;
      else cP+=c.mat+c.lab+c.moh;
    });});
    var sid=getSidingCost(f.so);
    f.matTotal=r2(mT);f.labTotal=r2(lT);f.mohTotal=r2(oT);f.sidingTotal=r2(sid);
    f.costF=r2(cF);f.costT=r2(cT);f.costP=r2(cP);f.costS=r2(sid);
    f.totalCost=r2(mT+lT+oT+sid);
  });
  var newWIP=r2(totalWIPVal());var newFGI=r2(totalFGIVal());
  log.push('New WIP: $'+newWIP.toLocaleString()+' | FGI: $'+newFGI.toLocaleString()+' | Combined: $'+r2(newWIP+newFGI).toLocaleString());
  rWIP();rFGI();updateHdr();
  setStatus('Saving rebuild…','#f0a030');
  var state={id:1,jobs:jobs,weekly_data:weeklyData,fgi_list:fgiList,
    siding_entries:sidingEntries,moh_history:mohHistory,moh_rate:mohRate,
    updated_at:new Date().toISOString(),updated_by:getUser()};
  fetch(SB_URL+'/rest/v1/kokomo_state',{
    method:'POST',
    headers:Object.assign({},sbHeaders(),{'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify(state)
  }).then(function(r){
    if(r.ok||r.status===201||r.status===204){
      setStatus('✓ Rebuild saved — '+new Date().toLocaleTimeString(),'#2dbd85');
      alert('✓ Done\n\n'+log.join('\n'));
    } else {

function sortFloorList(arr){
  var a=arr.slice();
  if(fmSort.col==='so'){
    a.sort(function(x,y){
      var sx=String(x.so||''),sy=String(y.so||'');
      var nx=parseInt(sx,10),ny=parseInt(sy,10);
      var bothNum=!isNaN(nx)&&!isNaN(ny)&&/^\d+$/.test(sx.trim())&&/^\d+$/.test(sy.trim());
      if(bothNum)return (nx-ny)*fmSort.dir;
      return sx.localeCompare(sy)*fmSort.dir;
    });
  } else if(fmSort.col==='location'){
    a.sort(function(x,y){
      var lx=(x.location||'').toLowerCase(),ly=(y.location||'').toLowerCase();
      if(lx!==ly)return lx<ly?-1*fmSort.dir:1*fmSort.dir;
      // tie-break by SO number
      var nx=parseInt(x.so,10),ny=parseInt(y.so,10);
      if(!isNaN(nx)&&!isNaN(ny))return nx-ny;
      return String(x.so||'').localeCompare(String(y.so||''));

}

    // reconciliation row
    +(function(){

      var diffOk=Math.abs(diff)<50;

        +'<td style="color:'+(diffOk?'#2dbd85':'#f0a030')+';">'+(diffOk?'✓ Reconciled':'⚠ Unaccounted')+'</td>'
        +'<td colspan="4" style="text-align:right;font-size:11px;color:#555;">WIP + FGI + COGS = '+fmt(accounted)+(diffOk?'':' &middot; diff '+fmt(diff))+'</td>'
        +'<td style="text-align:right;color:'+(diffOk?'#2dbd85':'#f0a030')+';">'+fmt(accounted)+'</td></tr>';
    })()
    +'</tbody></table></div>';

  // Balance sheet summary card for finance
  var bsHtml='<div class="card" style="margin-bottom:1rem;"><div class="card-title">Balance sheet snapshot — for the P&amp;L close</div>'
    +'<table><tbody>'
    +'<tr><td style="color:#888;">WIP inventory (asset) <span style="color:#555;font-size:10px;">incl. ready-to-ship</span></td><td style="text-align:right;font-weight:600;color:#4a9eff;">'+fmt(r2(wipTotAll+reg.total))+'</td></tr>'
    +'<tr><td style="color:#888;">FGI inventory (asset) <span style="color:#555;font-size:10px;">floor models</span></td><td style="text-align:right;font-weight:600;color:#f0a030;">'+fmt(flr.total)+'</td></tr>'
    +'<tr style="border-top:1px solid #222;font-weight:600;"><td>Total inventory on balance sheet</td><td style="text-align:right;">'+fmt(r2(wipTotAll+reg.total+flr.total))+'</td></tr>'
    +'<tr style="border-top:1px solid #222;"><td style="color:#e24b4a;">COGS recognized (P&amp;L expense)</td><td style="text-align:right;font-weight:600;color:#e24b4a;">'+fmt(cogsTot)+'</td></tr>'
    +(estFloorVal>0?'<tr style="border-top:1px solid #222;"><td style="color:#666;font-style:italic;">Est. floor models (memo — NOT in totals)</td><td style="text-align:right;color:#666;font-style:italic;">'+fmt(estFloorVal)+'</td></tr>':'')
    +'</tbody></table>'
    +'<div style="font-size:11px;color:#555;margin-top:.75rem;line-height:1.5;">WIP now includes completed islands that are ready to ship (customer orders held until delivery); FGI is floor-model inventory. Both are <strong>balance-sheet assets</strong>. COGS is the <strong>P&amp;L expense</strong> recognized when islands ship. Together they equal total costs entered ('+fmt(enteredTot)+').</div>'
    +'</div>';

  // Monthly movement (opening / change / closing) — only when a specific month is selected
  var movementHtml='';
  if(cutoff!==null){
    var op=snapAt(priorMonth(cutoff)),cl=snapAt(cutoff);
    var dtc=new Date(cutoff+'-01T00:00:00'),dtp=new Date(priorMonth(cutoff)+'-01T00:00:00');
    var moLong=dtc.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    var opLbl='end of '+dtp.toLocaleDateString('en-US',{month:'short',year:'2-digit'});
    var mvRow=function(label,o,c,strong){
      var chg=r2(c-o),clr=chg>0?'#2dbd85':chg<0?'#e24b4a':'#555';
      return'<tr'+(strong?' style="border-top:1px solid #222;font-weight:600;"':'')+'>'
        +'<td style="color:'+(strong?'#e8e8e8':'#ccc')+';">'+label+'</td>'
        +'<td style="text-align:right;color:#888;">'+fmt(o)+'</td>'
        +'<td style="text-align:right;color:'+clr+';font-weight:600;">'+(chg===0?'—':(chg>0?'+':'')+fmt(chg))+'</td>'
        +'<td style="text-align:right;color:#e8e8e8;">'+fmt(c)+'</td></tr>';
    };
    var enteredThisMo=r2(cl.entTot-op.entTot),deliveredThisMo=r2(cl.cogs-op.cogs);
    movementHtml='<div class="card" style="padding:0;overflow-x:auto;margin-bottom:1rem;">'
      +'<div class="hdr-row"><div style="font-weight:600;color:#e8e8e8;">'+moLong+' &mdash; opening balance, change, closing balance</div><span style="font-size:11px;color:#555;">what actually moved during the month</span></div>'
      +'<table><thead><tr><th style="width:260px;">Position</th>'
      +'<th style="width:150px;text-align:right;">Opening <span style="color:#555;font-size:10px;">('+opLbl+')</span></th>'
      +'<th style="width:150px;text-align:right;">Change this month</th>'
      +'<th style="width:150px;text-align:right;">Closing</th></tr></thead><tbody>'
      +mvRow('WIP inventory (incl. ready-to-ship)',r2(op.wip+op.reg),r2(cl.wip+cl.reg))
      +mvRow('FGI inventory (floor models)',op.flr,cl.flr)
      +mvRow('Total inventory on hand',r2(op.wip+op.reg+op.flr),r2(cl.wip+cl.reg+cl.flr),true)
      +'</tbody></table>'
      +'<div style="display:flex;gap:2rem;flex-wrap:wrap;padding:.75rem 1rem;border-top:1px solid #222;font-size:12px;">'
      +'<div><span style="color:#555;">Costs entered this month:</span> <span style="color:#4a9eff;font-weight:600;">'+fmt(enteredThisMo)+'</span></div>'
      +'<div><span style="color:#555;">Delivered &rarr; COGS this month:</span> <span style="color:#e24b4a;font-weight:600;">'+fmt(deliveredThisMo)+'</span></div>'
      +'</div></div>';
  }

  el.innerHTML=selectorHtml
    +(cutoff!==null?'<div class="info" style="margin-bottom:1rem;">Showing <strong>'+monthLabel.replace(' (month-end)','')+'</strong> — the opening/change/closing table below shows the month\'s activity; the tables under it show the cumulative position as of month-end. Switch to "All time (current)" for live data.</div>':'')
    +movementHtml+summaryHtml+breakdownHtml+flowHtml+bsHtml
    +'<div style="display:flex;justify-content:flex-end;margin-bottom:2rem;"><button onclick="exportFGIReport()" style="font-size:12px;padding:8px 16px;background:#1a2a1a;color:#2dbd85;border:1px solid #1a3a1a;border-radius:7px;cursor:pointer;font-weight:600;">&#8681; Export finance report (CSV)</button></div>';
}

// Export a CSV the finance team can drop into their P&L workpapers
window.exportFGIReport=function(){
  var regFGI=fgiList.filter(function(f){return f.status==='fgi';});
  var floorFGI=fgiList.filter(function(f){return f.status==='floormodel'&&!f.estimated;});
  var delivered=fgiList.filter(function(f){return f.status==='delivered'&&!f.estimated;});
  function sumB(arr){return arr.reduce(function(s,f){s.mat+=f.matTotal||0;s.lab+=f.labTotal||0;s.moh+=f.mohTotal||0;s.total+=f.totalCost||0;return s;},{mat:0,lab:0,moh:0,total:0});}
  var reg=sumB(regFGI),flr=sumB(floorFGI),cogs=sumB(delivered);
  var wipSummary=getWIPSummary();
  var wipMat=r2(wipSummary.reduce(function(s,r){return s+r.mat;},0));
  var wipLab=r2(wipSummary.reduce(function(s,r){return s+r.lab;},0));
  var wipMoh=r2(wipSummary.reduce(function(s,r){return s+r.moh;},0));
  var wipSid=r2(wipSummary.reduce(function(s,r){return s+(r.siding||0);},0));

  var rows=[
    ['KoKoMo Job Costing — Finance Summary','','','',''],
    ['Generated',new Date().toLocaleString(),'','',''],
    ['',''],
    ['Stage','Materials','Labor','MOH','Total'],
    ['WIP (production + ready-to-ship)',r2(wipMat+reg.mat),r2(wipLab+reg.lab),r2(wipMoh+reg.moh),r2(wipMat+wipLab+wipMoh+wipSid+reg.total)],
    ['FGI (floor models, held)',r2(flr.mat),r2(flr.lab),r2(flr.moh),r2(flr.total)],
    ['COGS (delivered, P&L)',r2(cogs.mat),r2(cogs.lab),r2(cogs.moh),r2(cogs.total)],
    ['',''],
    ['Balance sheet inventory total','','','',r2(wipMat+wipLab+wipMoh+wipSid+reg.total+flr.total)],
    ['P&L COGS expense','','','',r2(cogs.total)]
  ];
  var csv=rows.map(function(r){return r.map(function(c){return typeof c==='number'?c:'"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='kokomo_finance_summary_'+todaySun()+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  logAction('Exported finance report','FGI breakdown CSV downloaded','');
}

function rWIP(){
  var el=document.getElementById('wip');
  var wipRows=getWIPSummary().sort(function(a,b){return(b.mat+b.lab+b.moh)-(a.mat+a.lab+a.moh);});
  var tMat=r2(wipRows.reduce(function(s,r){return s+r.mat;},0));
  var tLab=r2(wipRows.reduce(function(s,r){return s+r.lab;},0));
  var tMOH=r2(wipRows.reduce(function(s,r){return s+r.moh;},0));
  var tSid=r2(wipRows.reduce(function(s,r){return s+r.siding;},0));
  var tWIP=r2(tMat+tLab+tMOH+tSid);
  var tFGI=r2(totalFGIVal()),tDel=r2(fgiList.filter(function(f){return f.status==='delivered';}).reduce(function(s,f){return s+f.totalCost;},0)),tFloor=r2(totalFloorVal());
  // Ready-to-ship (completed, not yet delivered) is now counted as WIP, not FGI.
  var _rs=fgiList.filter(function(f){return f.status==='fgi';});
  var rsMat=r2(_rs.reduce(function(s,f){return s+(f.matTotal||0);},0));
  var rsLab=r2(_rs.reduce(function(s,f){return s+(f.labTotal||0);},0));
  var rsMoh=r2(_rs.reduce(function(s,f){return s+(f.mohTotal||0);},0));
  var tWIPall=r2(tWIP+tFGI); // WIP incl ready-to-ship

  // ── Month-end WIP balance (same calc as P&L monthly report) ──
  var monthlyWIP={};
  function ensureMo(mo){
    if(!monthlyWIP[mo]){
      var dt=new Date(mo+'-01T00:00:00');
      monthlyWIP[mo]={mat:0,bur:0,moh:0,moLabel:dt.toLocaleDateString('en-US',{month:'short',year:'numeric'})};
    }
    return monthlyWIP[mo];
  }
  Object.keys(weeklyData).sort().forEach(function(sun){
    var wd=weeklyData[sun];
    var split=weekMonthSplit(sun); // {YYYY-MM: fraction by workday}
    var wMat=0,wBur=0,wMoh=0;
    ['Framing','Tile','PSU'].forEach(function(dept){
      if(wd&&wd[dept]){wMat+=wd[dept].mat||0;wBur+=wd[dept].burden||0;wMoh+=(wd[dept].hrs||0)*mohRateFor(sun);}
    });
    Object.keys(split).forEach(function(mo){
      var d=ensureMo(mo),fr=split[mo];
      d.mat+=wMat*fr;d.bur+=wBur*fr;d.moh+=wMoh*fr;
    });
  });
  sidingEntries.forEach(function(e){
    if(!e.date)return;
    var mo=e.date.slice(0,7);
    if(!monthlyWIP[mo]){var dt=new Date(e.date+'T00:00:00');monthlyWIP[mo]={mat:0,bur:0,moh:0,moLabel:dt.toLocaleDateString('en-US',{month:'short',year:'numeric'})};}
    monthlyWIP[mo].mat+=e.cost;
  });
  var monthlyFGIOut={};
  fgiList.forEach(function(f){
    var allJ=jobs.filter(function(j){return j.so===f.so;});
    if(!allJ.length)return; // imported/historical — never passed through WIP here
    if(!(f.status==='floormodel'||f.status==='delivered'))return; // ready-to-ship stays in WIP
    var psuJ=jobs.find(function(j){return j.so===f.so&&j.dept==='PSU';});
    var tileJ=jobs.find(function(j){return j.so===f.so&&j.dept==='Tile';});
    var compJ=psuJ||tileJ;
    var compMo=null;
    if(compJ){
      var compH=compJ.history.filter(function(h){return h.pctA>=1;}).sort(function(a,b){return a.sun.localeCompare(b.sun);});
      if(compH.length)compMo=compH[0].sun.slice(0,7);
    }
    if(f.status==='delivered'&&f.deliveredDate)compMo=f.deliveredDate.slice(0,7);
    if(!compMo)compMo=f.sun?f.sun.slice(0,7):null;
    if(!compMo)return;
    var oMat=0,oLab=0,oMoh=0;
    allJ.forEach(function(j){j.wipCosts.forEach(function(c){oMat+=c.mat;oLab+=c.lab;oMoh+=c.moh;});});
    if(!monthlyFGIOut[compMo])monthlyFGIOut[compMo]={total:0,mat:0,lab:0,moh:0};
    monthlyFGIOut[compMo].total+=r2(oMat+oLab+oMoh);
    monthlyFGIOut[compMo].mat+=oMat;
    monthlyFGIOut[compMo].lab+=oLab;
    monthlyFGIOut[compMo].moh+=oMoh;
  });
  var allMonths=Array.from(new Set(Object.keys(monthlyWIP).concat(Object.keys(monthlyFGIOut)))).sort();
  var cumMat=0,cumLab=0,cumMoh=0;
  var monthEndMat={},monthEndLab={},monthEndMoh={},monthEndTot={};
  allMonths.forEach(function(mo){
    var w=monthlyWIP[mo]||{mat:0,bur:0,moh:0};
    var out=monthlyFGIOut[mo]||{mat:0,lab:0,moh:0};
    cumMat=r2(cumMat+w.mat-out.mat);
    cumLab=r2(cumLab+w.bur-out.lab);
    cumMoh=r2(cumMoh+w.moh-out.moh);
    monthEndMat[mo]=cumMat;monthEndLab[mo]=cumLab;monthEndMoh[mo]=cumMoh;
    monthEndTot[mo]=r2(cumMat+cumLab+cumMoh);
  });
  // Anchor final month to the real WIP report totals
  if(allMonths.length){
    var lastMo=allMonths[allMonths.length-1];
    monthEndMat[lastMo]=r2(tMat+rsMat);monthEndLab[lastMo]=r2(tLab+rsLab);monthEndMoh[lastMo]=r2(tMOH+rsMoh);monthEndTot[lastMo]=tWIPall;
  }

  var monthEndHtml=allMonths.length===0?'':'<div class="card" style="padding:0;overflow-x:auto;margin-bottom:1rem;">'
    +'<div class="hdr-row"><div style="font-weight:600;color:#e8e8e8;">WIP balance — end of month</div><div style="font-size:11px;color:#555;">cumulative materials + labor + MOH still in production, by month</div></div>'
    +'<table><thead><tr>'
    +'<th style="width:80px;">Month</th>'
    +'<th style="width:100px;text-align:right;">Materials</th>'
    +'<th style="width:100px;text-align:right;">Labor</th>'
    +'<th style="width:100px;text-align:right;">MOH</th>'
    +'<th style="width:110px;text-align:right;">WIP balance</th>'
    +'<th style="width:90px;text-align:right;color:#555;">Change</th>'
    +'</tr></thead><tbody>'
    +allMonths.map(function(mo,i){
      var w=monthlyWIP[mo]||{moLabel:mo};
      var label=w.moLabel||mo;
      var prevTot=i>0?monthEndTot[allMonths[i-1]]:0;
      var change=r2(monthEndTot[mo]-prevTot);
      var changeStr=change===0?'—':(change>0?'+':'')+fmt(change);
      var changeClr=change>0?'#4a9eff':change<0?'#e24b4a':'#555';
      return'<tr>'
        +'<td style="font-weight:600;color:#e8e8e8;white-space:nowrap;">'+label+'</td>'
        +'<td style="text-align:right;color:#aaa;">'+fmt(monthEndMat[mo])+'</td>'
        +'<td style="text-align:right;color:#aaa;">'+fmt(monthEndLab[mo])+'</td>'
        +'<td style="text-align:right;color:#aaa;">'+fmt(monthEndMoh[mo])+'</td>'
        +'<td style="text-align:right;font-weight:700;color:#4a9eff;">'+fmt(monthEndTot[mo])+'</td>'
        +'<td style="text-align:right;font-size:11px;color:'+changeClr+';">'+changeStr+'</td>'
        +'</tr>';
    }).join('')
    +'</tbody></table></div>';

  el.innerHTML=
    '<div class="grid"><div class="metric"><div class="mlabel">WIP total</div><div class="mval" style="color:#4a9eff;">'+fmt(tWIPall)+'</div></div><div class="metric"><div class="mlabel">Materials in WIP</div><div class="mval">'+fmt(r2(tMat+rsMat))+'</div></div><div class="metric"><div class="mlabel">Labor in WIP</div><div class="mval">'+fmt(r2(tLab+rsLab))+'</div></div><div class="metric"><div class="mlabel">MOH in WIP</div><div class="mval">'+fmt(r2(tMOH+rsMoh))+'</div></div><div class="metric"><div class="mlabel">FGI (floor models)</div><div class="mval" style="color:#f0a030;">'+fmt(tFloor)+'</div></div></div>'
    +monthEndHtml
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">'
    +'<div class="card" style="margin:0;"><div class="card-title">WIP roll-forward</div><table><tbody>'
    +'<tr><td style="color:#555;">Beginning balance</td><td style="text-align:right;color:#555;">—</td></tr>'
    +'<tr><td style="padding-left:1rem;">+ Materials added</td><td style="text-align:right;color:#4a9eff;">'+fmt(tMat)+'</td></tr>'
    +'<tr><td style="padding-left:1rem;">+ Labor added</td><td style="text-align:right;color:#4a9eff;">'+fmt(tLab)+'</td></tr>'
    +'<tr><td style="padding-left:1rem;">+ MOH applied</td><td style="text-align:right;color:#4a9eff;">'+fmt(tMOH)+'</td></tr>'
    +(tSid>0?'<tr><td style="padding-left:1rem;">+ Siding</td><td style="text-align:right;color:#a090d0;">'+fmt(tSid)+'</td></tr>':'')
    +'<tr><td style="padding-left:1rem;">+ Ready-to-ship completed (held in WIP)</td><td style="text-align:right;color:#4a9eff;">'+fmt(tFGI)+'</td></tr>'
    +'<tr><td style="padding-left:1rem;color:#e24b4a;">&minus; To FGI (floor models) &amp; COGS</td><td style="text-align:right;color:#e24b4a;">('+fmt(r2(tDel+tFloor))+')</td></tr>'
    +'<tr style="font-weight:600;border-top:1px solid #222;"><td>WIP ending balance</td><td style="text-align:right;color:#4a9eff;">'+fmt(tWIPall)+'</td></tr>'
    +'</tbody></table></div>'
    +'<div class="card" style="margin:0;"><div class="card-title">Balance sheet summary</div><table><tbody>'
    +'<tr><td>WIP inventory <span style="color:#555;font-size:10px;">(incl. ready-to-ship)</span></td><td style="text-align:right;font-weight:600;color:#4a9eff;">'+fmt(tWIPall)+'</td></tr>'
    +'<tr><td>FGI inventory <span style="color:#555;font-size:10px;">(floor models)</span></td><td style="text-align:right;font-weight:600;color:#f0a030;">'+fmt(tFloor)+'</td></tr>'
    +'<tr style="font-weight:600;border-top:1px solid #222;"><td>Total inventory assets</td><td style="text-align:right;">'+fmt(r2(tWIPall+tFloor))+'</td></tr>'

// Cost-flow report: what entered WIP, what moved WIP->FGI, and what became COGS.
window.exportCostFlowCSV=function(){
  function esc(v){return typeof v==='number'?v:'"'+String(v==null?'':v).replace(/"/g,'""')+'"';}
  function moOf(s){return s?s.slice(0,7):'';}
  function compMonthOf(f){var pj=jobs.find(function(j){return j.so===f.so&&j.dept==='PSU';})||jobs.find(function(j){return j.so===f.so&&j.dept==='Tile';});if(pj){var h=pj.history.filter(function(x){return (x.pctA||0)>=1;}).sort(function(a,b){return a.sun.localeCompare(b.sun);});if(h.length)return h[0].sun.slice(0,7);}if(f.deliveredDate)return f.deliveredDate.slice(0,7);return f.sun?f.sun.slice(0,7):'';}
  function sidingAsOfMonth(so,mo){return sidingEntries.filter(function(e){return e.so===so&&!e.pending&&e.date&&e.date.slice(0,7)<=mo;}).reduce(function(s,e){return s+(e.cost||0);},0);}
  function stageInfo(so,dept){var dj=jobs.filter(function(j){return j.so===so&&j.dept===dept;});if(!dj.length)return{done:'',cost:0,exists:false};var mat=0,lab=0,moh=0,done='';dj.forEach(function(j){j.wipCosts.forEach(function(c){mat+=c.mat;lab+=c.lab;moh+=c.moh;});var comp=j.history.filter(function(h){return (h.pctA||0)>=1;}).sort(function(a,b){return a.sun.localeCompare(b.sun);});if(comp.length&&(!done||comp[0].sun<done))done=comp[0].sun;});return{done:done,cost:r2(mat+lab+moh),exists:true};}

  var rows=[];
  rows.push(['KoKoMo Job Costing \u2014 Detailed Cost Flow Report']);
  rows.push(['Generated',new Date().toLocaleString()]);
  rows.push(['Model','WIP = in production + completed ready-to-ship; FGI = floor-model inventory; COGS = delivered/sold. Siding is its own cost line.']);
  rows.push([]);

  var moSet={};
  Object.keys(weeklyData).forEach(function(sun){var sp=weekMonthSplit(sun);Object.keys(sp).forEach(function(m){moSet[m]=true;});});
  sidingEntries.forEach(function(e){if(!e.pending&&e.date)moSet[e.date.slice(0,7)]=true;});
  fgiList.forEach(function(f){if(f.estimated)return;if(f.deliveredDate)moSet[f.deliveredDate.slice(0,7)]=true;var cm=compMonthOf(f);if(cm)moSet[cm]=true;});
  var months=Object.keys(moSet).sort();

  // SECTION 1 — monthly cost input
  var entByMo={};
  Object.keys(weeklyData).forEach(function(sun){var wd=weeklyData[sun];var sp=weekMonthSplit(sun);Object.keys(sp).forEach(function(mo){var fr=sp[mo];if(!entByMo[mo])entByMo[mo]={mat:0,lab:0,moh:0,sid:0};['Framing','Tile','PSU'].forEach(function(d){if(wd&&wd[d]){entByMo[mo].mat+=(wd[d].mat||0)*fr;entByMo[mo].lab+=(wd[d].burden||0)*fr;entByMo[mo].moh+=((wd[d].hrs||0)*mohRateFor(sun))*fr;}});});});
  sidingEntries.forEach(function(e){if(e.pending||!e.date)return;var mo=e.date.slice(0,7);if(!entByMo[mo])entByMo[mo]={mat:0,lab:0,moh:0,sid:0};entByMo[mo].sid+=e.cost||0;});
  rows.push(['SECTION 1 \u2014 COSTS ENTERED EACH MONTH (Weekly Entry + Siding)']);
  rows.push(['Month','Materials','Labor','MOH','Siding','Total']);
  var e1={mat:0,lab:0,moh:0,sid:0};
  months.forEach(function(mo){var d=entByMo[mo]||{mat:0,lab:0,moh:0,sid:0};e1.mat+=d.mat;e1.lab+=d.lab;e1.moh+=d.moh;e1.sid+=d.sid;rows.push([mo,r2(d.mat),r2(d.lab),r2(d.moh),r2(d.sid),r2(d.mat+d.lab+d.moh+d.sid)]);});
  rows.push(['TOTAL',r2(e1.mat),r2(e1.lab),r2(e1.moh),r2(e1.sid),r2(e1.mat+e1.lab+e1.moh+e1.sid)]);
  rows.push([]);

  // SECTION 2 — monthly positions (end-of-month balances)
  function snapMonth(mo){
    var eMat=0,eLab=0,eMoh=0,eSid=0;
    Object.keys(weeklyData).forEach(function(sun){var wd=weeklyData[sun];var sp=weekMonthSplit(sun);var fr=0;Object.keys(sp).forEach(function(m){if(m<=mo)fr+=sp[m];});if(fr<=0)return;['Framing','Tile','PSU'].forEach(function(d){if(wd&&wd[d]){eMat+=(wd[d].mat||0)*fr;eLab+=(wd[d].burden||0)*fr;eMoh+=((wd[d].hrs||0)*mohRateFor(sun))*fr;}});});
    sidingEntries.forEach(function(e){if(!e.pending&&e.date&&e.date.slice(0,7)<=mo)eSid+=(e.cost||0);});
    var leftWIP=0,floor=0,cogs=0;
    fgiList.forEach(function(f){if(f.estimated)return;var cm=compMonthOf(f);var completed=cm&&cm<=mo;var deliv=f.deliveredDate&&f.deliveredDate.slice(0,7)<=mo;var base=(f.matTotal||0)+(f.labTotal||0)+(f.mohTotal||0)+sidingAsOfMonth(f.so,mo);var built=jobs.some(function(j){return j.so===f.so&&j.wipCosts&&j.wipCosts.length;});if(completed&&built)leftWIP+=base;if(deliv)cogs+=base;else if(completed&&(f.status==='floormodel'||f.source==='psu_short'))floor+=base;});
    return{entered:r2(eMat+eLab+eMoh+eSid),wip:r2(eMat+eLab+eMoh+eSid-leftWIP),fgi:r2(floor),cogs:r2(cogs)};
  }
  rows.push(['SECTION 2 \u2014 MONTHLY POSITIONS (end-of-month balances; reconstructed)']);
  rows.push(['Month','Entered this month','COGS this month','WIP balance (end)','FGI balance (end)','COGS cumulative']);
  var prevCogs=0;
  months.forEach(function(mo){var s=snapMonth(mo);var em=entByMo[mo]||{mat:0,lab:0,moh:0,sid:0};var entMo=r2(em.mat+em.lab+em.moh+em.sid);var cogsMo=r2(s.cogs-prevCogs);prevCogs=s.cogs;rows.push([mo,entMo,cogsMo,s.wip,s.fgi,s.cogs]);});
  rows.push([]);

  flushCogsSub();

  rows.push(['TRACKED TOTAL (in financials)','','','',r2(fT.mat),r2(fT.lab),r2(fT.moh),r2(fT.sid),r2(fT.tot)]);

  var soSet={};jobs.forEach(function(j){soSet[j.so]=true;});fgiList.forEach(function(f){if(!f.estimated)soSet[f.so]=true;});
  Object.keys(soSet).sort().forEach(function(so){
    var f=fgiList.find(function(x){return x.so===so&&!x.estimated;});
    var status;if(f){status=f.status==='delivered'?'Delivered':f.status==='floormodel'?'Floor model':'Ready to ship';}
    else{var act=jobs.filter(function(j){return j.so===so&&j.pct<1;});status=act.length?('In production ('+act[0].dept+' '+Math.round(act[0].pct*100)+'%)'):'In production';}
    var fr=stageInfo(so,'Framing'),ti=stageInfo(so,'Tile'),ps=stageInfo(so,'PSU');
    var sid=getSidingCost(so);

    rows.push([so,(getSOName(so)||(f&&f.name)||''),status,fr.done||'',fr.exists?r2(fr.cost):'',ti.done||'',ti.exists?r2(ti.cost):'',ps.done||'',ps.exists?r2(ps.cost):'',r2(sid),r2(total),(f&&f.deliveredDate)||'']);
  });
  rows.push([]);

  // SECTION 6 — current balances
  var ws=getWIPSummary(),rs=fgiList.filter(function(f){return f.status==='fgi';}),fl=fgiList.filter(function(f){return f.status==='floormodel'&&!f.estimated;});
  var wMat=r2(ws.reduce(function(s,r){return s+r.mat;},0)+rs.reduce(function(s,f){return s+(f.matTotal||0);},0));
  var wLab=r2(ws.reduce(function(s,r){return s+r.lab;},0)+rs.reduce(function(s,f){return s+(f.labTotal||0);},0));
  var wMoh=r2(ws.reduce(function(s,r){return s+r.moh;},0)+rs.reduce(function(s,f){return s+(f.mohTotal||0);},0));
  var wSid=r2(ws.reduce(function(s,r){return s+(r.siding||0);},0)+rs.reduce(function(s,f){return s+(f.sidingTotal||0);},0));
  var flMat=r2(fl.reduce(function(s,f){return s+(f.matTotal||0);},0)),flLab=r2(fl.reduce(function(s,f){return s+(f.labTotal||0);},0)),flMoh=r2(fl.reduce(function(s,f){return s+(f.mohTotal||0);},0)),flSid=r2(fl.reduce(function(s,f){return s+(f.sidingTotal||0);},0));
  rows.push(['SECTION 6 \u2014 CURRENT BALANCES','Materials','Labor','MOH','Siding','Total']);

  rows.push(['COGS (delivered, cumulative)',r2(gC.mat),r2(gC.lab),r2(gC.moh),r2(gC.sid),r2(gC.tot)]);

  var blob=new Blob([csv],{type:'text/csv'});

  a.href=url;a.download='kokomo-cost-flow-'+todaySun()+'.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
